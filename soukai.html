<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交野市PTA 総会資料 くらべる板</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#f4f0e6;--surface:#fff;--ink:#2b2a26;--ink2:#6f6a60;--ink3:#a39d91;
 --line:#e7e1d4;--line2:#d9d2c2;
 --navy:#2d445f;--navy2:#3f5d83;--navy-soft:#e5ebf2;
 --amber:#d98a3c;--amber-d:#a9631d;--amber-soft:#f8ead4;
 --teal:#3a9d7e;--teal-d:#2c7a61;--teal-soft:#e1efe9;
 --red:#c65f45;--red-soft:#f7e2da;
 --seal:#b4472f;
 --r:15px;--r-s:11px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Zen Maru Gothic",sans-serif}
.mincho{font-family:"Shippori Mincho",serif}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}
.hd{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.hd-in{max-width:940px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Zen Maru Gothic";font-weight:700;font-size:16.5px;letter-spacing:.02em}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--seal);display:flex;align-items:center;justify-content:center;font-family:"Shippori Mincho";font-weight:700;color:#fff;font-size:15px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.hd .sub{font-size:11.5px;color:#c4cfdd;font-weight:400;font-family:"Noto Sans JP"}
.axiswrap{display:flex;align-items:center;gap:7px;margin-left:auto}
.axiswrap .al{font-size:11px;color:#a9b7c8;font-family:"Zen Maru Gothic";white-space:nowrap}
.axissel{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:6px 10px;font-size:13px;font-family:"Zen Maru Gothic";font-weight:500;cursor:pointer}
.axissel option{color:#222}
.nav{background:#26394f}.nav-in{max-width:940px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.navbtn{background:none;border:none;color:#c1ccda;font-family:"Zen Maru Gothic";font-weight:500;font-size:14px;padding:11px 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.navbtn:hover{color:#fff}.navbtn.on{color:#fff;border-bottom-color:var(--amber)}
.page{padding:22px 0 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.muted{color:var(--ink2)}.tiny{font-size:12px}
.sec-h{font-family:"Zen Maru Gothic";font-weight:700;font-size:17px;margin:0 0 13px;display:flex;align-items:center;gap:9px}.sec-h .ic{color:var(--amber);display:flex}
.warnbar{background:var(--amber-soft);border:1px solid #eacfaa;color:var(--amber-d);border-radius:11px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.hero{background:linear-gradient(175deg,#fff,#fbf7ef);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"議";position:absolute;right:-14px;bottom:-30px;font-family:"Shippori Mincho";font-weight:700;font-size:150px;color:rgba(180,71,47,.05);line-height:1;pointer-events:none}
.hero h2{font-size:21px;margin-bottom:6px;line-height:1.4;position:relative}
.hero .lead{font-size:14px;color:var(--ink2);max-width:660px;position:relative}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 15px;min-width:96px}
.stat b{font-family:"Zen Maru Gothic";font-size:22px;font-weight:700;color:var(--navy);display:block;line-height:1.15}
.stat span{font-size:11.5px;color:var(--ink2)}
.stat.hl b{color:var(--seal)}
.aibox{background:linear-gradient(180deg,#fbf5eb,#fff);border:1px solid var(--amber-soft);border-radius:var(--r);padding:17px 19px;margin-bottom:16px}
.aibox .aih{font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;color:var(--amber-d);display:flex;align-items:center;gap:8px;margin-bottom:11px}
.aibox .airow{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.aibox .airow:last-child{border-bottom:none}
.aibox .aitag{flex-shrink:0;font-size:11px;font-weight:700;font-family:"Zen Maru Gothic";border-radius:7px;padding:3px 9px;white-space:nowrap;margin-top:1px}
.aitag.common{background:var(--teal-soft);color:var(--teal-d)}
.aitag.uniq{background:var(--red-soft);color:var(--red)}
.aitag.mix{background:var(--navy-soft);color:var(--navy2)}
.aibox .aitx{font-size:13.5px;line-height:1.7}
.aibox .aimeta{font-size:11px;color:var(--ink3);margin-top:11px}
.filt{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 14px}
.filt .fl{font-size:12px;font-weight:700;color:var(--ink3);font-family:"Zen Maru Gothic"}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:none;background:none;font-family:"Zen Maru Gothic";font-size:12.5px;padding:7px 13px;cursor:pointer;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:none}.seg button.on{background:var(--navy);color:#fff}
/* card */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;scroll-margin-top:96px}
.tcard.uniq{border-color:#e7c3b3}
.tcard-main{padding:15px 18px}
.tcard-main.tap{cursor:pointer}.tcard-main.tap:hover{background:#fdfbf6}
.tmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.chchip{font-size:11px;color:var(--navy2);background:var(--navy-soft);border-radius:6px;padding:2px 9px;font-weight:500;white-space:nowrap}
.mark{font-size:10.5px;font-weight:700;font-family:"Zen Maru Gothic";border-radius:6px;padding:2px 9px;white-space:nowrap}
.mark.uniq{background:var(--seal);color:#fff}.mark.minor{background:var(--amber);color:#fff}.mark.common{background:var(--teal);color:#fff}
.mark.rank{background:var(--navy);color:#fff}
.ttitle{font-family:"Zen Maru Gothic";font-weight:700;font-size:16.5px;line-height:1.4;margin-bottom:4px}
.tai{font-size:13px;color:var(--ink2);line-height:1.65;margin-bottom:12px}
.stance{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.stance:first-of-type{border-top:none}
.sdot{width:11px;height:11px;border-radius:50%;margin-top:6px;flex-shrink:0}
.sbody{flex:1;min-width:0}
.slabel{font-size:13.5px;font-weight:500;line-height:1.55;margin-bottom:5px}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-size:12px;font-family:"Zen Maru Gothic";font-weight:700;min-width:26px;height:26px;padding:0 7px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line2);color:var(--ink2)}
.bdg.ax{background:var(--seal);color:#fff;border-color:var(--seal);box-shadow:0 1px 4px rgba(180,71,47,.3)}
.scount{font-size:11.5px;color:var(--ink3);white-space:nowrap;margin-top:6px;flex-shrink:0}
.meter{display:flex;height:8px;border-radius:5px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.meter i{height:100%;display:block}
/* ★ signature: まね／らく の2択チップ */
.tips{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
@media(max-width:600px){.tips{grid-template-columns:1fr}}
.tip{border-radius:11px;padding:9px 12px;font-size:12.5px;line-height:1.6;border:1px solid}
.tip .tl{display:flex;align-items:center;gap:5px;font-family:"Zen Maru Gothic";font-weight:700;font-size:11.5px;margin-bottom:3px}
.tip.mane{background:var(--teal-soft);border-color:#bfe2d3;color:var(--teal-d)}
.tip.mane .tx{color:#2f5f50}
.tip.raku{background:var(--navy-soft);border-color:#cddae8;color:var(--navy2)}
.tip.raku .tx{color:#3d5064}
/* number rows */
.nrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.nrow.ax{background:linear-gradient(90deg,#fdf3ee,transparent);border-radius:8px;padding:7px 10px;margin:0 -10px;box-shadow:inset 3px 0 0 var(--seal)}
.nlab{width:34px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.nlab .nm{font-size:12.5px;font-weight:500;color:var(--navy);font-family:"Zen Maru Gothic"}
.ntrack{flex:1;height:20px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.ntrack i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--navy))}
.nrow.ax .ntrack i{background:linear-gradient(90deg,#d0714f,var(--seal))}
.nval{width:104px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:500}
.nnote{font-size:11.5px;color:var(--ink3);margin:-2px 0 6px 84px;line-height:1.5}
.nnote.ax{color:var(--seal)}
.numstats{display:flex;gap:20px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.numstats div{font-size:11.5px;color:var(--ink2)}
.numstats b{display:block;font-family:"Zen Maru Gothic";font-size:15px;color:var(--navy)}
.expander{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:var(--paper);border-top:1px solid var(--line);cursor:pointer;font-family:"Zen Maru Gothic";font-size:12.5px;color:var(--navy2);font-weight:500}
.expander:hover{background:#efe9dc}
.detail{padding:4px 18px 16px;background:#fcfaf5;border-top:1px solid var(--line)}
.drow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.drow:last-child{border-bottom:none}
.drow.ax{background:linear-gradient(90deg,#fdf3ee,transparent);border-radius:8px;padding:11px 10px;margin:0 -10px;box-shadow:inset 3px 0 0 var(--seal)}
.dsch{width:100px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.dsch .nm{font-size:12.5px;font-weight:700;color:var(--navy);font-family:"Zen Maru Gothic"}
.dsch .rf{font-size:10.5px;color:var(--ink3);line-height:1.4}
.dsch .rl{font-size:9.5px;font-weight:700;color:#fff;background:var(--seal);border-radius:5px;padding:1px 6px;width:fit-content}
.dsch .sm{font-size:9.5px;font-weight:700;color:var(--amber-d);background:var(--amber-soft);border:1px solid #eacfaa;border-radius:5px;padding:1px 6px;width:fit-content}
.dtxt{flex:1;font-size:13px;line-height:1.7;white-space:pre-wrap}
.dtxt.none{color:var(--ink3)}
.pending-note{margin-top:12px;font-size:12px;color:var(--ink3);background:var(--paper);border:1px dashed var(--line2);border-radius:9px;padding:8px 12px}
/* PDF */
.pdf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.pdf-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;transition:.13s}
.pdf-card.real{border-color:#e7c3b3;background:linear-gradient(180deg,#fffdfb,#fff)}
.pdf-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px)}
.pdf-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.pdf-ico{width:46px;height:56px;flex-shrink:0;border-radius:6px;background:linear-gradient(160deg,#fff,#f0e8d8);border:1.5px solid var(--line2);position:relative;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.pdf-ico::before{content:"";position:absolute;top:0;right:0;border-width:0 13px 13px 0;border-style:solid;border-color:var(--paper) var(--paper) var(--line2) var(--line2)}
.pdf-ico .seal{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-family:"Shippori Mincho";font-weight:700;font-size:15px;color:var(--seal);opacity:.9}
.pdf-ico .lines{position:absolute;top:12px;left:7px;right:7px;display:flex;flex-direction:column;gap:3px}
.pdf-ico .lines i{height:2px;background:var(--line2);border-radius:2px;display:block}
.pdf-ico .lines i:nth-child(2){width:70%}.pdf-ico .lines i:nth-child(4){width:55%}
.pdf-name{font-family:"Zen Maru Gothic";font-weight:700;font-size:14.5px;line-height:1.35}
.pdf-badge{font-size:10px;font-weight:700;border-radius:6px;padding:1px 8px;margin-top:4px;display:inline-block}
.pdf-badge.real{background:var(--red-soft);color:var(--seal)}
.pdf-badge.samp{background:var(--paper);color:var(--ink3);border:1px solid var(--line2)}
.pdf-actions{display:flex;flex-direction:column;gap:7px}
.pdf-btn{font-family:"Zen Maru Gothic";font-size:12.5px;font-weight:500;border-radius:9px;padding:8px 11px;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);display:flex;align-items:center;gap:7px;text-decoration:none;transition:.12s}
.pdf-btn:hover{background:#faf7f0;border-color:var(--ink3)}
.pdf-btn.full{background:var(--navy);border-color:var(--navy);color:#fff}.pdf-btn.full:hover{background:var(--navy2)}
.pdf-btn.dim{opacity:.5;cursor:not-allowed}.pdf-btn.dim:hover{background:#fff;border-color:var(--line2)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,25,20,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:16px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;transform:translateY(10px);transition:.2s}
.modal-bg.show .modal{transform:none}
.modal-h{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:2}
.modal-h .mt{font-family:"Zen Maru Gothic";font-weight:700;font-size:15.5px;flex:1}
.modal-h .mx{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-h .mx:hover{background:rgba(255,255,255,.28)}
.modal-body{padding:20px 22px 30px;max-height:calc(100vh - 130px);overflow-y:auto}
.doc-note{background:var(--amber-soft);border:1px solid #eacfaa;border-radius:9px;padding:9px 13px;font-size:12px;color:var(--amber-d);margin-bottom:16px;display:flex;gap:7px;align-items:flex-start}
.doc-ch{font-family:"Shippori Mincho";font-weight:700;font-size:15px;color:var(--seal);margin:20px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--amber-soft)}
.doc-ch:first-child{margin-top:0}
.btable{width:100%;border-collapse:collapse;font-size:12px}
.btable th{background:var(--navy);color:#fff;font-weight:500;padding:7px 8px;text-align:right;white-space:nowrap;font-size:11px}
.btable th:first-child{text-align:left}
.btable td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.btable td:first-child{text-align:left;white-space:normal}
.btable td.ex{text-align:left;white-space:normal;color:var(--ink2);font-size:11px;min-width:130px}
.btable tr:nth-child(even) td{background:#fcfaf5}
.btable tr.sum td{font-weight:700;background:var(--paper);color:var(--navy)}
.chglist{list-style:none;margin-top:6px}
.chglist li{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.chglist li:last-child{border-bottom:none}
.chglist .no{font-family:"Zen Maru Gothic";font-weight:700;color:var(--seal);flex-shrink:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 19px;border-radius:11px;font-size:13.5px;z-index:200;box-shadow:0 6px 22px rgba(0,0,0,.25);opacity:0;transition:.25s;font-family:"Zen Maru Gothic"}
.toast.show{opacity:1}
.empty-note{text-align:center;color:var(--ink3);padding:34px 10px;font-size:14px}
@media(max-width:560px){.dsch{width:82px}.hero h2{font-size:19px}.nval{width:88px}.nnote{margin-left:0}}

.allbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:14px;display:flex;flex-direction:column;gap:9px}
.allq{width:100%;box-sizing:border-box;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;background:#fdfcf9}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:inherit;font-size:12px;padding:4px 11px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.schrow{display:flex;flex-direction:column;gap:5px;margin:9px 0 7px}
.srow{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.slab{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-top:2px}
.slab.kai{background:#e8f3ee;color:#2f7d64}
.slab.non{background:#f0eee9;color:#8a8175}
.sch{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.bdg.kai{border-color:#bcdcd0;background:#f2faf6}
.bdg.non{opacity:.45}
.bdg.kai.ax,.bdg.non.ax{background:var(--seal);color:#fff;border-color:var(--seal);opacity:1}
.mark.gapm{background:#fbf0ed;color:#b4472f}
.prow{padding:10px 0;border-bottom:1px dotted var(--line)}
.prow.ax{background:#fdf6f3;margin:0 -12px;padding:10px 12px;border-radius:8px}
.phead{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:4px}
.ptext{font-size:13.5px;line-height:1.8;color:var(--ink2)}
.ptext.none{color:var(--ink3)}
.lackline{font-size:12px;color:#a8672a;background:#fdf7ee;border-radius:8px;padding:6px 9px;margin-top:10px}
.howline{font-size:12px;color:var(--ink3);background:#faf7f1;border-radius:8px;padding:6px 9px;margin:8px 0 10px}

/* ---- 予算を比較タブ：先頭ジャンプナビ／指標カード注記／算出根拠／その他収入一覧／セクション見出し ---- */
.tocbar{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.tocgh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;text-align:left;font-family:"Zen Maru Gothic";font-weight:700;font-size:14px;color:var(--navy);padding:6px 2px;cursor:pointer}
.tocgh:hover{color:var(--navy2)}
.tocgh .car{display:inline-block;transition:transform .15s;color:var(--ink3);font-size:13px}
.tocgh.open .car{transform:rotate(90deg)}
.tocgh .n{font-size:11.5px;font-weight:500;color:var(--ink3);margin-left:2px}
.toclist{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 6px 22px}
.toclink{font-size:12px;font-family:"Zen Maru Gothic";color:var(--navy2);background:var(--navy-soft);border-radius:7px;padding:4px 10px;text-decoration:none;white-space:nowrap}
.toclink:hover{background:var(--navy);color:#fff}
.mcnote{font-size:11.5px;color:var(--ink3);margin:-2px 0 6px 44px;line-height:1.5}
.mcnote.ax{color:var(--seal)}
.evbtn{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:var(--paper);border-top:1px solid var(--line);cursor:pointer;font-family:"Zen Maru Gothic";font-size:12.5px;color:var(--navy2);font-weight:500}
.evbtn:hover{background:#efe9dc}
.evrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;font-size:12.5px}
.evrow:last-child{border-bottom:none}
.evsch{width:40px;flex-shrink:0;padding-top:1px}
.evbody{flex:1;color:var(--ink2);line-height:1.7}
.evbody .en{color:var(--ink3)}
.inclist{margin-top:10px}
.incrow{padding:9px 0;border-bottom:1px dashed var(--line)}

<script>
/* ============================================================
   交野市PTA 総会資料 くらべる板（デモ）

const I={

 copy:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',

};

/* ---- 学校 ---- */
/* ============================================================
   交野市PTA 総会資料 くらべる板
   データは Googleスプレッドシート「交野市PTA_単P比較DB」から読み込みます。
   HTMLの中にデータは持っていません。直すときはスプレッドシートを直してください。
   会費収入は 01_学校マスタ、それ以外の予算項目は 06_会計_元数値 の「共通科目」を
   その場で集計しています（数値を持ち回っていません）。
   ============================================================ */
const SHEET_ID='1ZetpDElLBqk2-YlH9WC0VU8RVFb8LiY9RnhroazO-14';
const SHEET_URL='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit';

let SCHOOLS=[], SUBMITTED=[], PENDING=[], SMAP={}, PDFS={}, DOCS=[];
let LEDGER=[], TODO=[], CODE2ID={}, CATROWS={};

let __gvizN=0;
function gviz(sheetName){
 return new Promise((resolve,reject)=>{
  const cb='__gviz_cb_'+(__gvizN++);
  const el=document.createElement('script'); let done=false;
  const cleanup=()=>{try{delete window[cb]}catch(e){window[cb]=undefined};el.remove()};
  window[cb]=(r)=>{done=true;
   try{
    const cols=r.table.cols.map((c,i)=>(c.label||c.id||('C'+i)).trim());
    const rows=r.table.rows.map(rw=>{const o={};cols.forEach((c,i)=>{const cell=rw.c&&rw.c[i];o[c]=(cell&&cell.v!=null)?cell.v:''});return o});
    cleanup(); resolve(rows);
   }catch(e){cleanup(); reject(e)}
  };
  el.onerror=()=>{if(!done){cleanup();reject(new Error(sheetName+' を読めませんでした'))}};
  el.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?headers=1&sheet='
        +encodeURIComponent(sheetName)+'&tqx=responseHandler:'+cb;
  document.head.appendChild(el);
  setTimeout(()=>{if(!done){cleanup();reject(new Error(sheetName+' の読み込みがタイムアウトしました'))}},20000);
 });
}
const S=v=>(v==null?'':String(v)).trim();
const isTrue=v=>v===true||S(v).toUpperCase()==='TRUE';
const N=v=>{const t=S(v).replace(/,/g,'');if(t===''||isNaN(+t))return null;return +t};

function buildSchools(mst){
 SCHOOLS=mst.filter(r=>S(r['板ID'])).sort((a,b)=>(+a['表示順']||99)-(+b['表示順']||99)).map(r=>({
  id:S(r['板ID']),code:S(r['校コード']),name:S(r['正式名称']),sname:S(r['略称']),badge:S(r['バッジ']),
  block:S(r['ブロック']),real:S(r['提出状況'])==='あり',pending:S(r['提出状況'])!=='あり',
  homes:N(r['会員家庭数【採用値】']),how:S(r['算出方法（板に表示する説明）']),
  certainty:S(r['算出の確からしさ']),fee:N(r['年会費_R8']),ayear:S(r['採用値の年度']),
  feeIncome:N(r['会費収入_R8予算'])
 }));
 SUBMITTED=SCHOOLS.filter(s=>!s.pending); PENDING=SCHOOLS.filter(s=>s.pending);
 SMAP={}; SCHOOLS.forEach(s=>SMAP[s.id]=s);
 CODE2ID={}; SCHOOLS.forEach(s=>CODE2ID[s.code]=s.id);
}
/* ============================================================
   予算を比較タブ（元気さんと合意した14項目 ＋ その他の実支出科目）
   ・すべて 06_会計_元数値 の「共通科目」列（元気さんが各校の予算科目を
     振り分けた列）を集計元にしています。KYOUTSUUのようなHTML内の手打ち
     暫定値は廃止し、シートの実データだけを根拠にしています。
   ・学校ごとの元の科目名・元の項目名・摘要（振り分けの根拠メモ）は
     そのまま各カードの「算出根拠を見る」から確認できます。
   ・会費収入だけは 01_学校マスタ の値（会費収入・家庭数・年会費）を使います。
   ============================================================ */
function buildBudget(fin){
 CATROWS={};
 fin.forEach(r=>{
  const id=CODE2ID[S(r['校コード'])]; if(!id)return;
  const cat=S(r['共通科目'])||S(r['名寄せ科目']); if(!cat)return;
  const rec={year:S(r['年度']),kbn:S(r['区分']),nayose:S(r['名寄せ科目']),
   yosan:N(r['予算額']),kessan:N(r['決算額']),
   honka:S(r['原本の科目']),honko:S(r['原本の項目']),note:S(r['摘要'])};
  (CATROWS[id]=CATROWS[id]||{})[cat]=(CATROWS[id][cat]||[]);
  CATROWS[id][cat].push(rec);
 });
}
function catEvRows(id,cat,year,nayose){
 return ((CATROWS[id]||{})[cat]||[]).filter(r=>r.year===year&&(!nayose||r.nayose===nayose));
}
function catSum(id,cat,year,which,nayose){
 const rows=catEvRows(id,cat,year,nayose);
 const v=rows.map(r=>r[which]).filter(x=>x!=null);
 return v.length?v.reduce((a,b)=>a+b,0):null;
}
function expBaseVal(id){
 const total=catSum(id,'＝支出合計','R8','yosan'); if(total==null)return null;
 const yobi=catSum(id,'予備費','R8','yosan')||0;
 return total-yobi;
}
/* 14項目に含まれない支出科目を、実データから動的に洗い出す（ハードコードしない） */
function allExpenseCats(){
 const AGG=new Set(['＝支出合計','＝当初予算額','＝収入合計']);
 const USED=new Set(METRIC_DEFS.filter(m=>m.kind==='cat').map(m=>m.cat).concat(['積立金','負担金','保険料']));
 const set=new Set();
 SUBMITTED.forEach(s=>{
  const cats=CATROWS[s.id]||{};
  Object.keys(cats).forEach(cat=>{
   if(AGG.has(cat)||USED.has(cat))return;
   if(cats[cat].some(r=>r.year==='R8'&&r.kbn==='支出')) set.add(cat);
  });
 });
 return [...set].sort((a,b)=>catTotalAll(b)-catTotalAll(a));
}
function catTotalAll(cat){
 return SUBMITTED.reduce((sum,s)=>sum+(catSum(s.id,cat,'R8','yosan')||0),0);
}
function futanHokenTotal(){
 return SUBMITTED.reduce((sum,s)=>sum+(catSum(s.id,'負担金','R8','yosan')||0)+(catSum(s.id,'保険料','R8','yosan')||0),0);
}
/* 14項目に含まれない支出科目のリスト。負担金・保険料は学校によって計上の仕方が違い割り戻しが難しいため
   1項目「負担金・保険料」にまとめて内訳併記、慶弔費は金額ごとに学校をまとめて表示する */
function expenseExtraItems(){
 const items=allExpenseCats().map(cat=>({id:'etc-'+cat,title:cat,total:catTotalAll(cat),kind:cat==='慶弔費'?'catgroup':'cat',cat}));
 const fh=futanHokenTotal();
 if(fh>0) items.push({id:'futan_hoken',title:'負担金・保険料',total:fh,kind:'futanhoken'});
 items.sort((a,b)=>b.total-a.total);
 return items;
}

/* ---- 指標の定義（元気さんと合意した14項目） ---- */
const METRIC_DEFS=[
 {id:'fee',group:'income',title:'会費収入額（学校全体・年額）',kind:'fee'},
 {id:'carry',group:'income',title:'繰越金の額',kind:'carry'},
 {id:'otherinc',group:'income',title:'その他の収入（繰越金・雑入以外）',kind:'incomeList'},
 {id:'exp',group:'expense',title:'予備費を除く支出額',kind:'expTotal'},
 {id:'koho',group:'expense',title:'広報費',kind:'cat',cat:'広報委員会費'},
 {id:'teirei',group:'expense',title:'フェスタ等定例行事費',kind:'cat',cat:'定例イベント費'},
 {id:'tanpatsu',group:'expense',title:'単発行事費',kind:'cat',cat:'単発イベント費'},
 {id:'gakunen',group:'expense',title:'学年委員活動費',kind:'cat',cat:'学年委員会費'},
 {id:'chiku',group:'expense',title:'地区委員活動費',kind:'cat',cat:'地区活動費'},
 {id:'sonota_iin',group:'expense',title:'その他委員会活動費',kind:'cat',cat:'その他委員会活動費'},
 {id:'yobi',group:'expense',title:'予備費',kind:'cat',cat:'予備費'},
 {id:'gakko_kizo',group:'expense',title:'学校寄贈費',kind:'cat',cat:'学校寄贈費'},
 {id:'jido_kizo',group:'expense',title:'児童生徒寄贈費',kind:'cat',cat:'児童生徒寄贈費'},
 {id:'tsumitate',group:'reserve',title:'目的があっての積立金の額',kind:'reserve'},
];
const GROUP_LABEL={income:'収入',expense:'支出',reserve:'積立'};

/* ---- 値の取得（学校ID -> {val,note,ev,evNote}） ---- */
function metricVals(def){
 const out={};
 SUBMITTED.forEach(s=>{
  if(def.kind==='fee'){
   if(s.feeIncome==null)return;
   out[s.id]={val:s.feeIncome,
    note:(s.homes?s.homes+'世帯':'')+(s.fee?'（1世帯あたり'+yen(s.fee)+'）':''),
    ev:null,evNote:'01_学校マスタ の「会費収入_R8予算」「会員家庭数【採用値】」「年会費_R8」を使用しています。'};
  }else if(def.kind==='carry'){
   const c=catSum(s.id,'繰越金','R8','yosan','前年度繰越金'); if(c==null)return;
   const base=expBaseVal(s.id);
   const yrs=(base&&base>0)?(c/base):null;
   out[s.id]={val:c,note:yrs!=null?('予備費除く支出の約'+(Math.round(yrs*10)/10)+'年分'):'',
    ev:catEvRows(s.id,'繰越金','R8','前年度繰越金')};
  }else if(def.kind==='expTotal'){
   const v=expBaseVal(s.id); if(v==null)return;
   const total=catSum(s.id,'＝支出合計','R8','yosan');
   const yobi=catSum(s.id,'予備費','R8','yosan')||0;
   out[s.id]={val:v,note:'支出合計'+yen(total||v)+'－予備費'+yen(yobi),
    ev:null,evNote:'支出合計（＝支出合計）から予備費を差し引いた金額です。内訳は他のカードをご覧ください。'};
  }else if(def.kind==='cat'){
   const v=catSum(s.id,def.cat,'R8','yosan'); if(v==null)return;
   out[s.id]={val:v,note:'',ev:catEvRows(s.id,def.cat,'R8')};
  }else if(def.kind==='futanhoken'){
   /* 学校によっては保険料を「負担金」科目の中に含めて計上しているため、
      共通科目名で負担金／保険料を分けて合算しない。実際の明細行（原本の科目・項目）
      をそのまま内訳として出し、合計だけを1つにまとめる。 */
   const rows=[...catEvRows(s.id,'負担金','R8'),...catEvRows(s.id,'保険料','R8')];
   if(!rows.length)return;
   const val=rows.reduce((a,r)=>a+(r.yosan!=null?r.yosan:(r.kessan||0)),0);
   const note=rows.map(r=>(r.honka||r.nayose)+yen(r.yosan!=null?r.yosan:(r.kessan||0))).join('／');
   out[s.id]={val,note,ev:rows};
  }else if(def.kind==='reserve'){
   const bal=catSum(s.id,'積立金','R8','yosan','積立金現在額');
   const add=catSum(s.id,'積立金','R8','yosan','積立金');
   if(bal==null&&add==null)return;
   out[s.id]={val:bal!=null?bal:0,
    note:(bal!=null?'':'残高の記載なし')+(add!=null?'（今年度の積立 '+yen(add)+'）':''),
    ev:catEvRows(s.id,'積立金','R8')};
  }
 });
 return out;
}

/* ---- ランキング表示 ---- */
function rankInfo(vals){
 const arr=Object.keys(vals).map(id=>({id,v:vals[id].val})).sort((a,b)=>b.v-a.v);
 const i=arr.findIndex(x=>x.id===ST.axis);
 return {rank:i<0?null:i+1,n:arr.length};
}

/* ---- 算出根拠（06_会計_元数値の該当行をそのまま出す） ---- */
const MEV={open:{}};
function toggleEv(id){MEV.open[id]=!MEV.open[id];render()}
function evidenceHTML(arr){
 if(arr.length && arr.every(x=>x.v.evNote)){
  return `<div class="detail"><div class="evglobal">${esc(arr[0].v.evNote)}</div></div>`;
 }
 const rows=arr.map(({s,v})=>{
  const sch=`<div class="evsch"><span class="bdg ${s.id===ST.axis?'ax':''}" title="${esc(s.sname)}">${esc(s.badge)}</span></div>`;
  if(!v.ev||!v.ev.length) return `<div class="evrow">${sch}<div class="evbody">該当する明細行がありません。</div></div>`;
  const inner=v.ev.map(r=>`${esc(r.honka||r.nayose)}${r.honko?'／'+esc(r.honko):''}　<b>${r.yosan!=null?esc(yen(r.yosan)):(r.kessan!=null?esc(yen(r.kessan))+'（決算）':'—')}</b>${r.note?`<span class="en">　${esc(r.note)}</span>`:''}`).join('<br>');
  return `<div class="evrow">${sch}<div class="evbody">${inner}</div></div>`;
 }).join('');
 return `<div class="detail">${rows}</div>`;
}

/* ---- 通常の指標カード ---- */
function metricCard(def){
 const vals=metricVals(def);
 const ids=Object.keys(vals);
 if(!ids.length)return '';
 const {rank,n}=rankInfo(vals);
 const arr=ids.map(id=>({s:SMAP[id],v:vals[id]})).sort((a,b)=>b.v.val-a.v.val);
 const max=Math.max(...arr.map(x=>x.v.val),1);
 const rankLabel=rank==null?'資料が届いていないため出せません':rank===1?n+'校で最も高い':rank===n?n+'校で最も低い':'高い方から'+rank+'番目';
 const lack=SUBMITTED.filter(s=>!vals[s.id]);
 const rows=arr.map(({s,v})=>{
  const isAx=s.id===ST.axis;
  return `<div class="nrow ${isAx?'ax':''}"><div class="nlab"><span class="bdg ${isAx?'ax':''}" title="${esc(s.sname)}">${esc(s.badge)}</span></div>
   <div class="ntrack"><i style="width:${Math.max(2,Math.round(v.val/max*100))}%"></i></div>
   <div class="nval">${esc(yen(v.val))}</div></div>
   ${v.note?`<div class="mcnote ${isAx?'ax':''}">${esc(v.note)}</div>`:''}`;
 }).join('');
 const lackHTML=lack.length?`<div class="lackline">${I.info} 資料が届いていないため計算できない学校：${esc(lack.map(s=>s.sname).join('・'))}</div>`:'';
 const open=MEV.open[def.id];
 return `<div class="tcard" id="m-${esc(def.id)}">
  <div class="tcard-main">
    <div class="tmeta"><span class="chchip">${esc(GROUP_LABEL[def.group])}</span><span class="mark ${rank===1||rank===n?'uniq':'rank'}">${esc(axisSchool().sname)}は${esc(rankLabel)}</span></div>
    <div class="ttitle">${esc(def.title)}</div>
    ${rows}
    ${lackHTML}
  </div>
  <div class="evbtn" onclick="toggleEv('${def.id}')">${open?'算出根拠を閉じる':'算出根拠を見る（06_会計_元数値より）'}<span>${open?I.up:I.down}</span></div>
  ${open?evidenceHTML(arr):''}
 </div>`;
}

/* ---- 金額ごとに学校をまとめるカード（慶弔費など、細かい割り戻しをしない科目向け） ---- */
function catGroupCard(def){
 const amtMap=new Map();
 const lack=[];
 SUBMITTED.forEach(s=>{
  const v=catSum(s.id,def.cat,'R8','yosan');
  if(v==null){lack.push(s);return;}
  if(!amtMap.has(v)) amtMap.set(v,[]);
  amtMap.get(v).push(s);
 });
 if(!amtMap.size)return '';
 const groups=[...amtMap.entries()].sort((a,b)=>b[0]-a[0]);
 const rows=groups.map(([amt,schools])=>{
  const chips=schools.map(s=>`<span class="bdg ${s.id===ST.axis?'ax':''}" title="${esc(s.sname)}">${esc(s.badge)}</span>`).join('');
  return `<div class="grow"><div class="gval">${esc(yen(amt))}</div><div class="gchips">${chips}</div></div>`;
 }).join('');
 const lackHTML=lack.length?`<div class="lackline">${I.info} 資料が届いていないため計算できない学校：${esc(lack.map(s=>s.sname).join('・'))}</div>`:'';
 return `<div class="tcard" id="m-${esc(def.id)}">
  <div class="tcard-main">
    <div class="tmeta"><span class="chchip">支出</span></div>
    <div class="ttitle">${esc(def.title)}</div>
    <div class="tai">同じ金額の学校をまとめています。</div>
    ${rows}
    ${lackHTML}
  </div>
 </div>`;
}

function buildDocs(rows){
 /* ユーザー指示により比較対象から除外する項目 */
 const EXCLUDE=['総会の案内文','書面表決書・委任状','議事録','会員への説明姿勢'];
 const byItem={};
 rows.forEach(r=>{
  const id=CODE2ID[S(r['校コード'])]; if(!id)return;
  const title=S(r['項目']); if(EXCLUDE.indexOf(title)>=0)return;
  const key=S(r['区分'])+'|'+title;

 });

async function boot(){
 document.getElementById('page').innerHTML=
  '<div class="card" style="padding:26px;text-align:center"><p class="lead" style="margin:0">スプレッドシートから読み込んでいます…</p></div>';
 try{
  const [mst,led,fin,doc,tod]=await Promise.all([
   gviz('01_学校マスタ'),gviz('02_ファイル台帳'),gviz('06_会計_元数値'),
   gviz('08_総会資料_構成'),gviz('11_未確認・宿題').catch(()=>[])]);
  LEDGER=led; TODO=tod;
  buildSchools(mst); buildBudget(fin); buildDocs(doc);
  PDFS={}; SCHOOLS.forEach(s=>PDFS[s.id]=[]);
  const WANT=['総会資料','決算書','予算書','事業計画','事業報告','決算明細'];
  LEDGER.forEach(r=>{
   if(S(r['公開可否'])!=='OK')return;
   const id=CODE2ID[S(r['校コード'])]; if(!id||!PDFS[id])return;
   const k=S(r['種別']); if(WANT.indexOf(k)<0)return;
   const u=S(r['共有URL']); if(!u)return;
   PDFS[id].push({kind:k,sub:S(r['小分類']),year:S(r['年度']),url:u,naka:S(r['中身'])});
  });
  if(!SCHOOLS.length) return fatal('01_学校マスタ に行がありません。');
  if(!Object.keys(CATROWS).length) return fatal('会計データを計算できませんでした。06_会計_元数値 をご確認ください。');
  if(!SMAP[ST.axis]||SMAP[ST.axis].pending) ST.axis=(SUBMITTED[0]||{}).id;
  render();
 }catch(e){ fatal(e&&e.message?e.message:String(e)); }
}

function docCard(t,i){
 const A=axisSchool(); const open=DST.open[i];
 const has=v=>v&&v!=='None'&&v!=='—'&&v!=='×'&&!String(v).startsWith('×');
 const yes=SUBMITTED.filter(s=>has(t.detail[s.id]));
 const no=SUBMITTED.filter(s=>t.detail[s.id]!==undefined&&!has(t.detail[s.id]));
 const chip=(s,cls)=>`<span class="bdg ${cls} ${s.id===ST.axis?'ax':''}" title="${esc(s.name)}">${esc(s.badge)}</span>`;
 const total=SUBMITTED.length;
 const mark = !has(t.detail[A.id]) ? `<span class="mark gapm">${esc(A.sname)}には無い</span>`
   : (yes.length===1 ? `<span class="mark uniq">${esc(A.sname)}だけ</span>`
   : (yes.length===total ? `<span class="mark common">全校にある</span>` : `<span class="mark minor">${yes.length}校にある</span>`));
 const mine=t.detail[A.id];
 let rows='';
 if(open){
  const ord=SUBMITTED.slice().sort((a,b)=>(b.id===ST.axis?1:0)-(a.id===ST.axis?1:0));
  rows=`<div class="detail">`+ord.map(s=>{
   const v=t.detail[s.id];
   return `<div class="prow ${s.id===ST.axis?'ax':''}"><div class="phead">
     <span class="bdg ${s.id===ST.axis?'ax':''}">${esc(s.badge)}</span><b>${esc(s.name)}</b></div>
     <div class="ptext ${has(v)?'':'none'}">${esc(v&&v!=='None'?v:'—')}</div></div>`;
  }).join('')+`</div>`;
 }
 return `<div class="tcard ${yes.length===1?'uniq':''}">
  <div class="tcard-main" onclick="toggleDoc(${i})">
   <div class="tmeta"><span class="chchip">${esc(t.ch)}</span>${mark}</div>
   <div class="ttitle">${esc(t.title)}</div>
   ${has(mine)?`<div class="tai"><b>${esc(A.sname)}：</b>${esc(mine)}</div>`:`<div class="tai">${esc(A.sname)}の資料には見当たりません。</div>`}
   <div class="schrow">
    ${yes.length?`<div class="srow"><span class="slab kai">ある</span><span class="sch">${yes.map(s=>chip(s,'kai')).join('')}</span><span class="scount">${yes.length}校</span></div>`:''}
    ${no.length?`<div class="srow"><span class="slab non">無い</span><span class="sch">${no.map(s=>chip(s,'non')).join('')}</span><span class="scount">${no.length}校</span></div>`:''}
   </div>
   <div class="meter"><i style="width:${yes.length/total*100}%;background:#3a9d7e"></i><i style="width:${no.length/total*100}%;background:#ece7db"></i></div>
  </div>
  <div class="expander" onclick="toggleDoc(${i})">${open?'各校の中身を閉じる':'各校の中身を見る'}<span>${open?I.up:I.down}</span></div>
  ${rows}
 </div>`;
}

function viewPDF(){
 let h=`<div class="hero"><h2>総会資料・決算書・予算書を1か所に</h2>
   <p class="lead">スプレッドシートの「02_ファイル台帳」から作っています。ファイルを差し替えたら共有URLの列を書き換えるだけで、ここも変わります。氏名や押印を含むファイル（公開可否＝NG）は出していません。岩船小は予算・決算の中身をこのページ内でも表で読めます。</p></div>`;
 h+=`<div class="card" style="margin-bottom:16px"><div class="sec-h"><span class="ic">${I.doc}</span>提出済み</div><div class="pdf-grid">`;
 h+=SUBMITTED.map(pdfCard).join('');
 h+=`</div></div>`;
 if(PENDING.length){
  h+=`<div class="card"><div class="sec-h"><span class="ic">${I.clock}</span>これから提出</div><div class="pdf-grid">`
   +PENDING.map(pdfCard).join('')+`</div></div>`;
 }
 return h;
}
function pdfCard(sc){
 const fs=(PDFS[sc.id]||[]);
 const badge=sc.pending?`<span class="pdf-badge samp">未提出</span>`:`<span class="pdf-badge real">原本あり ${fs.length}件</span>`;
 const full='';
 const links=fs.map(x=>`<a class="pdf-btn" href="${esc(x.url)}" target="_blank" rel="noopener">${I.pdf} ${esc(x.kind)}${x.sub?'・'+esc(x.sub):''}${x.year?'（'+esc(x.year)+'）':''}</a>`).join('');
 return `<div class="pdf-card ${fs.length?'real':''}">
   <div class="pdf-top"><div class="pdf-ico"><div class="lines"><i></i><i></i><i></i><i></i></div><span class="seal mincho">議</span></div>
     <div><div class="pdf-name">${esc(sc.name)}<br>総会資料ほか</div>${badge}</div></div>
   <div class="pdf-actions">${full}${links||`<button class="pdf-btn dim">${sc.pending?'未提出':'準備中'}</button>`}</div>
 </div>`;
}

/* ---- 提出状況 ---- */
const DOCKINDS=['決算書','決算明細','予算書','総会資料','事業計画','事業報告','その他'];
const KIND_NEED={'決算書':1,'予算書':1,'総会資料':1};
function ledgerBySchool(){
 const m={}; SCHOOLS.forEach(s=>m[s.id]={});
 LEDGER.forEach(r=>{const id=CODE2ID[S(r['校コード'])];if(!id||!m[id])return;
  const k=S(r['種別']); if(!k||k==='（未提出）')return; (m[id][k]=m[id][k]||[]).push(r)});
 return m;
}
function viewStatus(){
 const by=ledgerBySchool();
 const files=LEDGER.filter(r=>S(r['DriveファイルID'])).length;
 const missing=[];
 SCHOOLS.forEach(s=>Object.keys(KIND_NEED).forEach(k=>{
  const a=(by[s.id]||{})[k]||[]; const real=a.filter(r=>!S(r['中身']).startsWith('参考'));
  if(!real.length) missing.push([s,k+(a.length?'（参考資料のみ）':'')]);
 }));
 let h=`<div class="hero"><h2>だれが何を出していて、何が足りないか</h2>
  <p class="lead">「02_ファイル台帳」から作っています。必須は<b>決算書・予算書・総会資料</b>の3点としています。</p>
  <div class="statrow">
   <div class="stat"><b>${SUBMITTED.length}</b><span>提出のあった学校</span></div>
   <div class="stat"><b>${files}</b><span>登録ファイル数</span></div>
   <div class="stat hl"><b>${missing.length}</b><span>未確認資料</span></div>
   <div class="stat"><b>${PENDING.length}</b><span>まだ何も未提出</span></div>
  </div></div>`;
 h+=`<div class="card" style="margin-bottom:16px"><div class="sec-h"><span class="ic">${I.doc}</span>提出マトリクス</div>
  <div style="overflow-x:auto"><table class="mx"><thead><tr><th class="sticky">学校</th>`
  +DOCKINDS.map(k=>`<th>${esc(k)}${KIND_NEED[k]?'<i class="req">必須</i>':''}</th>`).join('')+`</tr></thead><tbody>`;
 SCHOOLS.forEach(s=>{
  h+=`<tr${s.id===ST.axis?' class="ax"':''}><td class="sticky"><span class="bdg ${s.id===ST.axis?'ax':''}">${esc(s.badge)}</span> ${esc(s.sname)}</td>`;
  DOCKINDS.forEach(k=>{
   const a=(by[s.id]||{})[k]||[]; const real=a.filter(r=>!S(r['中身']).startsWith('参考'));
   if(real.length) h+=`<td class="ok">${real.length>1?real.length:'○'}</td>`;
   else if(a.length) h+=`<td class="ref">△</td>`;
   else h+=`<td class="${KIND_NEED[k]?'ng':'na'}">${KIND_NEED[k]?'未':'−'}</td>`;
  });
  h+=`</tr>`;
 });
 h+=`</tbody></table></div><p class="tiny muted" style="margin-top:10px">${I.info} 数字はファイル数。「未」は必須なのに届いていないもの、「△」は参考資料だけで本体が無いもの、「−」は任意のものです。</p></div>`;
 if(missing.length){
  const byS={}; missing.forEach(([s,k])=>{(byS[s.id]=byS[s.id]||{s,ks:[]}).ks.push(k)});
  h+=`<div class="card" style="margin-bottom:16px"><div class="sec-h"><span class="ic">${I.clock}</span>未確認資料（${missing.length}件）</div><div class="misslist">`
   +Object.values(byS).map(x=>`<div class="missrow"><span class="bdg">${esc(x.s.badge)}</span><b>${esc(x.s.name)}</b><span class="misstags">${x.ks.map(k=>`<i>${esc(k)}</i>`).join('')}</span></div>`).join('')
   +`</div></div>`;
 }
 const open2=TODO.filter(r=>S(r['状態'])&&S(r['状態'])!=='決定済'&&S(r['状態'])!=='解決済');
 if(open2.length){
  h+=`<div class="card"><div class="sec-h"><span class="ic">${I.info}</span>確認が要るところ（${open2.length}件）</div><div class="todos">`
   +open2.map(r=>`<div class="todo"><div class="tt"><b>${esc(S(r['対象']))}</b><i class="st">${esc(S(r['状態']))}</i></div>
     <div class="td">${esc(S(r['内容']))}</div><div class="tw">${esc(S(r['どう埋めるか']))}</div></div>`).join('')+`</div></div>`;
 }
 return h;
}

function closeModal(){document.getElementById('modalBg').classList.remove('show');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

boot();
</script></body></html>
