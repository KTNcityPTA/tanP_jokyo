<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交野市PTA 会則・細則 くらべる板</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#f4f0e6;--surface:#fff;--ink:#2b2a26;--ink2:#6f6a60;--ink3:#a39d91;
 --line:#e7e1d4;--line2:#d9d2c2;
 --navy:#2d445f;--navy2:#3f5d83;--navy-soft:#e5ebf2;
 --amber:#d98a3c;--amber-d:#a9631d;--amber-soft:#f8ead4;
 --teal:#3a9d7e;--teal-d:#2c7a61;--teal-soft:#e1efe9;
 --red:#c65f45;--red-soft:#f7e2da;
 --seal:#b4472f;
 --r:15px;--r-s:11px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Zen Maru Gothic",sans-serif}
.mincho{font-family:"Shippori Mincho",serif}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}
/* header */
.hd{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.hd-in{max-width:940px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Zen Maru Gothic";font-weight:700;font-size:16.5px;letter-spacing:.02em}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--seal);display:flex;align-items:center;justify-content:center;font-family:"Shippori Mincho";font-weight:700;color:#fff;font-size:15px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.hd .sub{font-size:11.5px;color:#c4cfdd;font-weight:400;font-family:"Noto Sans JP"}
.nav{background:#26394f}.nav-in{max-width:940px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.navbtn{background:none;border:none;color:#c1ccda;font-family:"Zen Maru Gothic";font-weight:500;font-size:14px;padding:11px 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.navbtn:hover{color:#fff}.navbtn.on{color:#fff;border-bottom-color:var(--amber)}
.page{padding:22px 0 80px}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.muted{color:var(--ink2)}.tiny{font-size:12px}.mb0{margin-bottom:0}
.sec-h{font-family:"Zen Maru Gothic";font-weight:700;font-size:17px;margin:0 0 13px;display:flex;align-items:center;gap:9px}.sec-h .ic{color:var(--amber);display:flex}
.btn{font-family:"Zen Maru Gothic";font-weight:500;font-size:14px;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);transition:.13s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#faf7f0;border-color:var(--ink3)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#fff}.btn.pri:hover{background:var(--amber-d);border-color:var(--amber-d)}
.btn.nv{background:var(--navy);border-color:var(--navy);color:#fff}.btn.nv:hover{background:var(--navy2)}
.btn.sm{font-size:12.5px;padding:6px 12px}
/* hero */
.hero{background:linear-gradient(175deg,#fff,#fbf7ef);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"約";position:absolute;right:-14px;bottom:-30px;font-family:"Shippori Mincho";font-weight:700;font-size:150px;color:rgba(180,71,47,.05);line-height:1;pointer-events:none}
.hero h2{font-size:21px;margin-bottom:6px;line-height:1.4;position:relative}
.hero .lead{font-size:14px;color:var(--ink2);max-width:640px;position:relative}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 15px;min-width:96px}
.stat b{font-family:"Zen Maru Gothic";font-size:24px;font-weight:700;color:var(--navy);display:block;line-height:1.15}
.stat span{font-size:11.5px;color:var(--ink2)}
.stat.hl b{color:var(--seal)}
/* AI summary */
.aibox{background:linear-gradient(180deg,#fbf5eb,#fff);border:1px solid var(--amber-soft);border-radius:var(--r);padding:17px 19px;margin-bottom:16px}
.aibox .aih{font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;color:var(--amber-d);display:flex;align-items:center;gap:8px;margin-bottom:11px}
.aibox .airow{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.aibox .airow:last-child{border-bottom:none}
.aibox .aitag{flex-shrink:0;font-size:11px;font-weight:700;font-family:"Zen Maru Gothic";border-radius:7px;padding:3px 9px;white-space:nowrap;margin-top:1px}
.aitag.common{background:var(--teal-soft);color:var(--teal-d)}
.aitag.uniq{background:var(--red-soft);color:var(--red)}
.aitag.mix{background:var(--navy-soft);color:var(--navy2)}
.aibox .aitx{font-size:13.5px;line-height:1.7}
.aibox .aimeta{font-size:11px;color:var(--ink3);margin-top:11px}
/* filter bar */
.filt{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 14px}
.filt .fl{font-size:12px;font-weight:700;color:var(--ink3);font-family:"Zen Maru Gothic"}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:none;background:none;font-family:"Zen Maru Gothic";font-size:12.5px;padding:7px 13px;cursor:pointer;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:none}.seg button.on{background:var(--navy);color:#fff}
/* topic card */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;transition:.13s}
.tcard.uniq{border-color:#e7c3b3}
.tcard-main{padding:15px 18px;cursor:pointer}
.tcard-main:hover{background:#fdfbf6}
.tmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.chchip{font-size:11px;color:var(--navy2);background:var(--navy-soft);border-radius:6px;padding:2px 9px;font-weight:500;white-space:nowrap}
.saisoku-chip{font-size:11px;color:var(--amber-d);background:var(--amber-soft);border:1px solid #eacfaa;border-radius:6px;padding:2px 9px;font-weight:500;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.saisoku-chip:hover{background:#f3ddba}
.mark{font-size:10.5px;font-weight:700;font-family:"Zen Maru Gothic";border-radius:6px;padding:2px 9px;white-space:nowrap}
.mark.uniq{background:var(--seal);color:#fff}.mark.minor{background:var(--amber);color:#fff}.mark.common{background:var(--teal);color:#fff}
.ttitle{font-family:"Zen Maru Gothic";font-weight:700;font-size:16.5px;line-height:1.4;margin-bottom:4px}
.tai{font-size:13px;color:var(--ink2);line-height:1.65;margin-bottom:12px}
/* stance rows */
.stance{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.stance:first-of-type{border-top:none}
.sdot{width:11px;height:11px;border-radius:50%;margin-top:6px;flex-shrink:0}
.sbody{flex:1;min-width:0}
.slabel{font-size:13.5px;font-weight:500;line-height:1.55;margin-bottom:5px}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-size:12px;font-family:"Zen Maru Gothic";font-weight:700;min-width:26px;height:26px;padding:0 7px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line2);color:var(--ink2)}
.bdg.iwa{background:var(--seal);color:#fff;border-color:var(--seal);box-shadow:0 1px 4px rgba(180,71,47,.3)}
.scount{font-size:11.5px;color:var(--ink3);white-space:nowrap;margin-top:6px;flex-shrink:0}
/* agreement meter */
.meter{display:flex;height:8px;border-radius:5px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.meter i{height:100%;display:block}
.expander{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:var(--paper);border-top:1px solid var(--line);cursor:pointer;font-family:"Zen Maru Gothic";font-size:12.5px;color:var(--navy2);font-weight:500}
.expander:hover{background:#efe9dc}
/* detail table */
.detail{padding:4px 18px 16px;background:#fcfaf5;border-top:1px solid var(--line)}
.drow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.drow:last-child{border-bottom:none}
.drow.iwa{background:linear-gradient(90deg,#fdf3ee,transparent);border-radius:8px;padding:11px 10px;margin:0 -10px}
.dsch{width:96px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.dsch .nm{font-size:12.5px;font-weight:700;color:var(--navy);font-family:"Zen Maru Gothic"}
.dsch .rf{font-size:10.5px;color:var(--ink3)}
.dsch .rl{font-size:9.5px;font-weight:700;color:#fff;background:var(--seal);border-radius:5px;padding:1px 6px;width:fit-content}
.dsch .sm{font-size:9.5px;font-weight:700;color:var(--amber-d);background:var(--amber-soft);border:1px solid #eacfaa;border-radius:5px;padding:1px 6px;width:fit-content}
.dtxt{flex:1;font-size:13px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.dtxt.none{color:var(--ink3);font-style:normal}
.pending-note{margin-top:12px;font-size:12px;color:var(--ink3);background:var(--paper);border:1px dashed var(--line2);border-radius:9px;padding:8px 12px}
/* PDF list */
.pdf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.pdf-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;transition:.13s;position:relative}
.pdf-card.real{border-color:#e7c3b3;background:linear-gradient(180deg,#fffdfb,#fff)}
.pdf-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px)}
.pdf-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.pdf-ico{width:46px;height:56px;flex-shrink:0;border-radius:6px;background:linear-gradient(160deg,#fff,#f0e8d8);border:1.5px solid var(--line2);position:relative;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.pdf-ico::before{content:"";position:absolute;top:0;right:0;border-width:0 13px 13px 0;border-style:solid;border-color:var(--paper) var(--paper) var(--line2) var(--line2)}
.pdf-ico .seal{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-family:"Shippori Mincho";font-weight:700;font-size:15px;color:var(--seal);opacity:.9}
.pdf-ico .lines{position:absolute;top:12px;left:7px;right:7px;display:flex;flex-direction:column;gap:3px}
.pdf-ico .lines i{height:2px;background:var(--line2);border-radius:2px;display:block}
.pdf-ico .lines i:nth-child(2){width:70%}.pdf-ico .lines i:nth-child(4){width:55%}
.pdf-name{font-family:"Zen Maru Gothic";font-weight:700;font-size:14.5px;line-height:1.35}
.pdf-badge{font-size:10px;font-weight:700;border-radius:6px;padding:1px 8px;margin-top:4px;display:inline-block}
.pdf-badge.real{background:var(--red-soft);color:var(--seal)}
.pdf-badge.samp{background:var(--paper);color:var(--ink3);border:1px solid var(--line2)}
.pdf-actions{display:flex;flex-direction:column;gap:7px}
.pdf-btn{font-family:"Zen Maru Gothic";font-size:12.5px;font-weight:500;border-radius:9px;padding:8px 11px;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);display:flex;align-items:center;gap:7px;text-decoration:none;transition:.12s}
.pdf-btn:hover{background:#faf7f0;border-color:var(--ink3)}
.pdf-btn.full{background:var(--navy);border-color:var(--navy);color:#fff}.pdf-btn.full:hover{background:var(--navy2)}
.pdf-btn.dim{opacity:.5;cursor:not-allowed}.pdf-btn.dim:hover{background:#fff;border-color:var(--line2)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,25,20,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:16px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;transform:translateY(10px);transition:.2s}
.modal-bg.show .modal{transform:none}
.modal-h{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:2}
.modal-h .mt{font-family:"Zen Maru Gothic";font-weight:700;font-size:16px;flex:1}
.modal-h .mx{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-h .mx:hover{background:rgba(255,255,255,.28)}
.modal-body{padding:22px 26px 30px;max-height:calc(100vh - 130px);overflow-y:auto}
.doc-note{background:var(--amber-soft);border:1px solid #eacfaa;border-radius:9px;padding:9px 13px;font-size:12px;color:var(--amber-d);margin-bottom:18px;display:flex;gap:7px;align-items:flex-start}
.doc-ch{font-family:"Shippori Mincho";font-weight:700;font-size:15px;color:var(--seal);margin:20px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--amber-soft)}
.doc-ch:first-child{margin-top:0}
.doc-art{margin-bottom:13px}
.doc-art .an{font-family:"Zen Maru Gothic";font-weight:700;font-size:13.5px;color:var(--navy);margin-bottom:2px}
.doc-art .at{font-size:13px;line-height:1.85;color:var(--ink);white-space:pre-wrap}
.doc-empty{text-align:center;color:var(--ink3);padding:40px 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .ld{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 19px;border-radius:11px;font-size:13.5px;z-index:200;box-shadow:0 6px 22px rgba(0,0,0,.25);opacity:0;transition:.25s;font-family:"Zen Maru Gothic"}
.toast.show{opacity:1}
.empty-note{text-align:center;color:var(--ink3);padding:34px 10px;font-size:14px}
@media(max-width:560px){.dsch{width:78px}.hero h2{font-size:19px}}
</style></head>
<body>
<div class="hd"><div class="hd-in">
 <div class="logo"><span class="mk mincho">約</span><span>交野市PTA 会則・細則 くらべる板<span class="sub"> ／ 単Pの見直しをらくにする</span></span></div>
</div>
<div class="nav"><div class="nav-in" id="nav"></div></div></div>
<div class="wrap"><div class="page" id="page"></div></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><span class="mt" id="modalTitle"></span><button class="mx" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   交野市PTA 会則・細則 くらべる板（デモ）
   ・岩船小学校 … 実際の会則/細則PDFから起こした本物データ
   ・他校 … 「集まるとこう見える」を体感してもらうためのサンプル（仮）
   ・条文番号は学校ごとにバラバラなので、AIが“趣旨”で束ねて並べています
   ============================================================ */

/* ---- 学校（badge＝頭文字バッジ） ---- */
const SCHOOLS=[
 {id:'iwa', name:'岩船小学校',    badge:'岩',  block:'４ブロック', real:true},
 {id:'kzu', name:'郡津小学校',    badge:'郡',  block:'２ブロック'},
 {id:'kra', name:'倉治小学校',    badge:'倉',  block:'２ブロック'},
 {id:'hsi', name:'星田小学校',    badge:'星',  block:'３ブロック'},
 {id:'kis', name:'私市小学校',    badge:'私',  block:'４ブロック'},
 {id:'fuj', name:'藤が尾小学校',  badge:'藤',  block:'４ブロック'},
 // ↓ まだ会則を出していない学校（“出してほしい”導線用）
 {id:'mir', name:'交野みらい学園',badge:'み',  block:'１ブロック', pending:true},
 {id:'ni2', name:'第２中学校',    badge:'２中',block:'２ブロック', pending:true},
 {id:'aki', name:'旭小学校',      badge:'旭',  block:'３ブロック', pending:true},
 {id:'ni3', name:'第３中学校',    badge:'３中',block:'３ブロック', pending:true},
];
const SUBMITTED=SCHOOLS.filter(s=>!s.pending);
const PENDING=SCHOOLS.filter(s=>s.pending);
const SMAP={};SCHOOLS.forEach(s=>SMAP[s.id]=s);

/* ---- Google Drive PDFリンク（各校から届いたら、ここに貼るだけ） ----
   例: kaisoku:'https://drive.google.com/file/d/xxxxx/view'
   空('')のあいだは「準備中」と表示されます。岩船の全文はアプリ内に埋め込み済みなので、
   リンクが無くても「全文を読む」ボタンはすぐ使えます。 */
const PDFS={
 iwa:{kaisoku:'', saisoku:''},   // ← ここに岩船会則/細則のDriveリンクを貼ると「PDFで開く」が有効化
 kzu:{kaisoku:'', saisoku:''},
 kra:{kaisoku:'', saisoku:''},
 hsi:{kaisoku:'', saisoku:''},
 kis:{kaisoku:'', saisoku:''},
 fuj:{kaisoku:'', saisoku:''},
};

/* ---- 比較の論点（AIが趣旨で束ねたもの） ----
   stances[0] を最上段に置く（多数派を先頭に）。
   kind: common(多数派) / variant(別バリエーション) / uniq(岩船のみ) を色分けに使用。
   detail: 各校の実際の条文番号(ref)と抜粋(t)。realは岩船の実データ。 */
const KAI=[
 {ch:'第1章 総則', title:'PTAの目的', saisoku:null,
  ai:'全校ほぼ共通。国のPTA標準に沿い「学校・家庭・社会で子どもの幸福な成長を図る」と定めています。文言の細部だけが各校で少し違います。',
  stances:[{kind:'common',label:'会員の協力で、学校・家庭・社会における児童の幸福な成長を図る',schools:['iwa','kzu','kra','hsi','kis','fuj']}],
  detail:{
   iwa:{ref:'第2条',real:true,t:'本会は、会員相互が協力して、学校と家庭と社会における児童の幸福な成長を図ることを目的とする。'},
   kzu:{ref:'第2条',t:'本会は、会員相互の協力のもと、家庭・学校・地域社会における児童の健全な育成を図ることを目的とする。'},
   kra:{ref:'第3条',t:'保護者と教職員が協力し、児童の幸福な成長と学校教育の充実に資することを目的とする。'},
   hsi:{ref:'第2条',t:'会員が協力して児童・生徒の幸福な成長を図り、あわせて会員相互の親睦を深める。'},
   kis:{ref:'第2条',t:'学校・家庭・社会における児童の福祉を増進し、健全な発達を図る。'},
   fuj:{ref:'第2条',t:'会員相互の協力により、児童の幸福な成長と教育環境の向上を図る。'},
  }},

 {ch:'第2章 会員', title:'会員になれる人', saisoku:null,
  ai:'全校共通で「在籍児童の保護者」と「本校教職員」の2種類。ここは市内で完全にそろっています。',
  stances:[{kind:'common',label:'在籍児童の保護者＋本校教職員',schools:['iwa','kzu','kra','hsi','kis','fuj']}],
  detail:{
   iwa:{ref:'第5条',real:true,t:'（１）本校に在籍する児童の保護者\n（２）本校教職員'},
   kzu:{ref:'第5条',t:'本校に在籍する児童の保護者、および本校の教職員。'},
   kra:{ref:'第4条',t:'本校児童の保護者と本校教職員をもって会員とする。'},

 const max=Math.max(...sizes);
 if(st.schools.length===1)return {mark:'uniq',label:'岩船のみ'};
 if(st.schools.length<max)return {mark:'minor',label:'少数派'};
 return {mark:'common',label:'多数派と一致'};
}
function submittedCount(tp){const set=new Set();tp.stances.forEach(s=>s.schools.forEach(x=>set.add(x)));return set.size}

/* ============ 描画 ============ */
function renderNav(){
 const items=[['kaisoku','会則をくらべる'],['saisoku','細則をくらべる'],['pdf','会則・細則PDF']];
 document.getElementById('nav').innerHTML=items.map(([v,l])=>`<button class="navbtn ${ST.tab===v?'on':''}" onclick="setTab('${v}')">${l}</button>`).join('');
}
function setTab(v){ST.tab=v;ST.expanded={};render()}
function toggleOnlyIwa(){ST.onlyIwa=!ST.onlyIwa;render()}
function toggleExp(i){ST.expanded[ST.tab+i]=!ST.expanded[ST.tab+i];render()}

function render(){
 renderNav();
 document.getElementById('page').innerHTML=(ST.tab==='pdf')?viewPDF():viewCompare();
}

function viewCompare(){
 const list=topics();
 const isKai=ST.tab==='kaisoku';
 const uniqCount=list.filter(t=>{const s=iwaStance(t);return s&&s.mark==='uniq'}).length;
 const minorCount=list.filter(t=>{const s=iwaStance(t);return s&&s.mark==='minor'}).length;
 const commonCount=list.filter(t=>{const s=iwaStance(t);return s&&s.mark==='common'}).length;

 // ヒーロー
 let h=`<div class="hero">
  <h2>${isKai?'会則':'細則'}を、条文番号ではなく“中身”でくらべる</h2>
  <p class="lead">条文の並びや言い回しは学校ごとに違います。同じ趣旨の条文をAIが束ねて横に並べたので、「うちだけ違うところ」「市内でそろっているところ」がひと目でわかります。まずは岩船小の実データ＋サンプル校でご覧ください。</p>
  <div class="statrow">
   <div class="stat"><b>${SUBMITTED.length}</b><span>提出校（岩船＝実データ）</span></div>
   <div class="stat"><b>${list.length}</b><span>くらべた論点</span></div>
   <div class="stat hl"><b>${uniqCount+minorCount}</b><span>岩船の特色・少数派</span></div>
   <div class="stat"><b>${PENDING.length}</b><span>これからの学校</span></div>
  </div>
 </div>`;

 // AIサマリー
 h+=`<div class="aibox">
   <div class="aih">${I.spark} AIによる全体のまとめ（岩船小の視点）</div>
   <div class="airow"><span class="aitag common">そろっている</span><div class="aitx">目的・会員資格・会計年度・会費の決め方は市内でほぼ共通。土台は各校とも同じ考え方です。</div></div>
   <div class="airow"><span class="aitag mix">分かれている</span><div class="aitx">${isKai?'総会の成立要件・会則改正のハードル(2/3か過半数か)・委員会の顔ぶれ(フェスタ名)で差が出ます。改正のしやすさに直結する部分です。':'役員の割り当て方(地区制か学年輪番か)・会長の決め方・会費の集め方で運用の色が分かれます。'}</div></div>
   <div class="airow"><span class="aitag uniq">岩船らしさ</span><div class="aitx">${isKai?'会計監査だけ任期を延ばし決算まで見届ける設計、そして個人情報を細則で手厚く整備している点が岩船の特色です。':'居住地区を2グループに分ける地区制と会長の輪番制、アルミ缶収益の使途明記、全16条の個人情報規約が岩船ならでは。他校の“お手本”になり得ます。'}</div></div>
   <div class="aimeta">${I.info} サンプル校の内容はイメージ用の仮データです。各校の会則が届くと、この比較が本物のデータに置き換わります。</div>
 </div>`;

 // フィルタ
 h+=`<div class="filt"><span class="fl">表示</span>
   <div class="seg"><button class="${!ST.onlyIwa?'on':''}" onclick="if(ST.onlyIwa)toggleOnlyIwa()">すべての論点</button><button class="${ST.onlyIwa?'on':''}" onclick="if(!ST.onlyIwa)toggleOnlyIwa()">岩船が他校と違う所だけ</button></div>
   <span style="flex:1"></span><span class="tiny muted">${I.tap} カードをタップで各校の条文を全文表示</span></div>`;

 // 論点カード
 const shown=ST.onlyIwa?list.filter(t=>{const s=iwaStance(t);return s&&s.mark!=='common'}):list;
 if(!shown.length){h+='<p class="empty-note">岩船が他校と違う論点はこのタブにはありません。「すべての論点」に切り替えてご覧ください。</p>';return h;}
 h+=shown.map(tp=>topicCard(tp,list.indexOf(tp))).join('');
 return h;
}

function topicCard(tp,i){
 const sub=submittedCount(tp);
 const st=iwaStance(tp);
 const expanded=ST.expanded[ST.tab+i];
 // メーター（提出校ぶんをスタンス色で。未提出は薄色）
 const total=SCHOOLS.length;
 let meter='';
 tp.stances.forEach(s=>{meter+=`<i style="width:${s.schools.length/total*100}%;background:${KINDCOL[s.kind]}"></i>`});
 const penN=total-sub;
 if(penN>0)meter+=`<i style="width:${penN/total*100}%;background:#ece7db"></i>`;

 // スタンス行
 const stanceRows=tp.stances.map(s=>{
  const badges=s.schools.map(id=>{const sc=SMAP[id];return `<span class="bdg ${id==='iwa'?'iwa':''}" title="${esc(sc.name)}">${esc(sc.badge)}</span>`}).join('');
  return `<div class="stance"><span class="sdot" style="background:${KINDCOL[s.kind]}"></span><div class="sbody"><div class="slabel">${esc(s.label)}</div><div class="badges">${badges}</div></div><span class="scount">${s.schools.length}校</span></div>`;
 }).join('');

 // 詳細（各校の条文）
 let detail='';
 if(expanded){
  const rows=SUBMITTED.map(sc=>{
   const d=tp.detail[sc.id];
   if(!d)return '';
   const isIwa=sc.id==='iwa';
   const refBadge=d.real?`<span class="rl">実データ</span>`:`<span class="sm">サンプル</span>`;
   return `<div class="drow ${isIwa?'iwa':''}"><div class="dsch"><span class="nm">${esc(sc.badge)}${isIwa?'':''}</span><span class="rf">${esc(sc.name)}</span><span class="rf">${esc(d.ref)}</span>${refBadge}</div><div class="dtxt ${d.t.startsWith('—')?'none':''}">${esc(d.t)}</div></div>`;
  }).join('');
  const penList=PENDING.map(s=>s.badge).join('・');
  detail=`<div class="detail">${rows}${penN>0?`<div class="pending-note">${I.clock} 未提出：${esc(PENDING.map(s=>s.name).join('・'))}（会則が届き次第ここに追加されます）</div>`:''}</div>`;
 }

 const saisokuChip=tp.saisoku?`<span class="saisoku-chip" onclick="event.stopPropagation();gotoSaisoku()">${I.link}${esc(tp.saisoku)}</span>`:'';
 const markHTML=st?`<span class="mark ${st.mark}">${esc(st.label)}</span>`:'';

 return `<div class="tcard ${st&&st.mark==='uniq'?'uniq':''}">
   <div class="tcard-main" onclick="toggleExp(${i})">
     <div class="tmeta"><span class="chchip">${esc(tp.ch)}</span>${markHTML}${saisokuChip}</div>
     <div class="ttitle">${esc(tp.title)}</div>
     <div class="tai">${esc(tp.ai)}</div>
     ${stanceRows}
     <div class="meter">${meter}</div>
   </div>
   <div class="expander" onclick="toggleExp(${i})">${expanded?'各校の条文を閉じる':`各校の実際の条文を見る（提出${sub}校）`}<span>${expanded?I.up:I.down}</span></div>
   ${detail}
 </div>`;
}
function gotoSaisoku(){ST.tab='saisoku';ST.expanded={};render();window.scrollTo(0,0);toast('細則タブに移動しました')}

/* ---- PDF一覧 ---- */
function viewPDF(){
 let h=`<div class="hero"><h2>会則・細則のPDFを1か所に</h2>
   <p class="lead">各校の会則・細則をここにまとめます。文書アイコンをタップすると全文をその場で読め、Google DriveのPDFにも飛べます（岩船小は全文を収録済み。他校はPDFリンクが届き次第、順次追加します）。</p></div>`;
 h+=`<div class="card" style="margin-bottom:16px"><div class="sec-h"><span class="ic">${I.doc}</span>提出済み</div><div class="pdf-grid">`;
 h+=SUBMITTED.map(pdfCard).join('');
 h+=`</div></div>`;
 h+=`<div class="card"><div class="sec-h"><span class="ic">${I.clock}</span>これから提出</div><div class="pdf-grid">`;
 h+=PENDING.map(pdfCard).join('');
 h+=`</div><p class="tiny muted" style="margin-top:14px">${I.info} PDFリンクは、各校から届いたものをコード内の一覧に貼るだけで有効化されます。難しい設定は不要です。</p></div>`;
 return h;
}
function pdfCard(sc){
 const isReal=sc.real;
 const pdf=PDFS[sc.id]||{};
 const hasK=pdf.kaisoku&&pdf.kaisoku.length>4;
 const hasS=pdf.saisoku&&pdf.saisoku.length>4;
 const fullBtn=isReal
   ? `<button class="pdf-btn full" onclick="openDoc('${sc.id}','kaisoku')">${I.book} 会則の全文を読む</button><button class="pdf-btn full" onclick="openDoc('${sc.id}','saisoku')">${I.book} 細則の全文を読む</button>`
   : (sc.pending
      ? `<button class="pdf-btn dim">未提出</button>`
      : `<button class="pdf-btn dim">全文は準備中</button>`);
 const driveK=hasK?`<a class="pdf-btn" href="${esc(pdf.kaisoku)}" target="_blank" rel="noopener">${I.pdf} 会則PDF(Drive)</a>`:'';
 const driveS=hasS?`<a class="pdf-btn" href="${esc(pdf.saisoku)}" target="_blank" rel="noopener">${I.pdf} 細則PDF(Drive)</a>`:'';
 const badge=isReal?`<span class="pdf-badge real">実データ収録</span>`:(sc.pending?`<span class="pdf-badge samp">これから</span>`:`<span class="pdf-badge samp">サンプル</span>`);
 return `<div class="pdf-card ${isReal?'real':''}">
   <div class="pdf-top"><div class="pdf-ico"><div class="lines"><i></i><i></i><i></i><i></i></div><span class="seal mincho">約</span></div>
     <div><div class="pdf-name">${esc(sc.name)}<br>PTA会則・細則</div>${badge}</div></div>
   <div class="pdf-actions">${fullBtn}${driveK}${driveS}</div>
 </div>`;
}

/* ---- 全文モーダル ---- */
function openDoc(sid,kind){
 const sc=SMAP[sid];
 let doc=null;
 if(sid==='iwa')doc=(kind==='kaisoku')?IWA_KAISOKU:IWA_SAISOKU;
 const body=document.getElementById('modalBody');
 document.getElementById('modalTitle').textContent=doc?doc.title:(sc.name+' '+(kind==='kaisoku'?'会則':'細則'));
 if(!doc){body.innerHTML='<div class="doc-empty">この学校の全文はまだ収録されていません。</div>';showModal();return;}
 let h=`<div class="doc-note">${I.info}<div>これは岩船小学校PTAの実際の${kind==='kaisoku'?'会則':'細則'}を要約・収録したものです。正式な原本は各校のPDFをご確認ください。</div></div>`;
 doc.chapters.forEach(c=>{h+=`<div class="doc-ch mincho">${esc(c.ch)}</div>`;c.arts.forEach(a=>{h+=`<div class="doc-art"><div class="an">${esc(a.n)}</div><div class="at">${esc(a.t)}</div></div>`})});
 body.innerHTML=h;showModal();
}
function showModal(){document.getElementById('modalBg').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modalBg').classList.remove('show');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

};

render();
