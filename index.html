<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交野市PTA 実態共有ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f3ec;--surface:#fff;--ink:#2b2a26;--ink2:#6f6a60;--ink3:#a39d91;--line:#e9e4d9;--line2:#dcd6c8;--navy:#30496a;--navy2:#3f5d83;--amber:#e0883b;--amber-d:#b5651d;--amber-soft:#fbedd6;--teal:#3a9d7e;--teal-d:#2c7a61;--teal-soft:#e3f1ea;--red:#cf6a4a;--red-soft:#fae6dd;--r:14px;--r-s:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Zen Maru Gothic",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:0 18px}
.hd{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff}
.hd-in{max-width:920px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:"Zen Maru Gothic";font-weight:700;font-size:17px}
.logo .mk{width:26px;height:26px;border-radius:8px;background:var(--amber);display:flex;align-items:center;justify-content:center}
.yearsel{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:5px 9px;font-size:13px;font-family:inherit;cursor:pointer}.yearsel option{color:#222}
.nav{background:#27405e}.nav-in{max-width:920px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.navbtn{background:none;border:none;color:#cdd7e4;font-family:"Zen Maru Gothic";font-weight:500;font-size:14px;padding:11px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}.navbtn:hover{color:#fff}.navbtn.on{color:#fff;border-bottom-color:var(--amber)}
.pvbanner{background:var(--amber-soft);color:var(--amber-d);font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #f0d9b5}
.page{padding:22px 0 70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.muted{color:var(--ink2)}.tiny{font-size:12px}
.sec-h{font-family:"Zen Maru Gothic";font-weight:700;font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}.sec-h .ic{color:var(--amber);display:flex}
.btn{font-family:"Zen Maru Gothic";font-weight:500;font-size:14px;border-radius:9px;padding:8px 15px;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);transition:.12s;display:inline-flex;align-items:center;gap:6px}.btn:hover{background:#faf7f0;border-color:var(--ink3)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#fff}.btn.pri:hover{background:var(--amber-d)}.btn.nv{background:var(--navy);border-color:var(--navy);color:#fff}.btn.nv:hover{background:var(--navy2)}.btn.sm{font-size:12.5px;padding:5px 11px}.btn.lg{font-size:15px;padding:11px 20px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line2);color:var(--ink2)}.chip.warn{background:var(--red-soft);border-color:#f0c9bb;color:var(--red);cursor:pointer}.chip.warn:hover{background:#f6d9cd}
.badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--amber);color:#fff}
.pbar{height:6px;background:var(--paper);border-radius:4px;overflow:hidden;border:1px solid var(--line)}.pbar>i{display:block;height:100%;background:var(--teal);border-radius:4px}
input.tx,textarea.tx,select.tx{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink);resize:vertical}
input.tx:focus,textarea.tx:focus,select.tx:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
label.lb{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:0 0 5px}
.hero{background:linear-gradient(180deg,#fff,#fdfbf6);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}.hero h2{font-size:19px;margin-bottom:3px;word-break:keep-all;overflow-wrap:break-word;line-height:1.4}.hero h2{min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--paper);border-radius:var(--r-s);padding:11px 12px;text-align:center}.stat b{font-family:"Zen Maru Gothic";font-size:23px;font-weight:700;color:var(--navy);display:block;line-height:1.2}.stat span{font-size:11.5px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.qmini{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.qmini:last-child{border-bottom:none}.qmini:hover .qm-t{color:var(--amber-d)}
.qm-cat{font-size:11px;color:var(--ink3);background:var(--paper);border-radius:5px;padding:1px 7px;white-space:nowrap}.qm-t{flex:1;font-size:14px;font-weight:500}
.blockh{font-family:"Zen Maru Gothic";font-weight:700;font-size:13px;color:var(--navy2);margin:14px 0 8px;display:flex;align-items:center;gap:7px}.blockh::before{content:"";width:4px;height:14px;background:var(--amber);border-radius:2px}.blockh:first-child{margin-top:0}
.schoolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;cursor:pointer;transition:.12s;position:relative}.scard:hover{border-color:var(--amber);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.scard .nm{font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:5px}.scard .pc{font-family:"Zen Maru Gothic";font-size:21px;font-weight:700;color:var(--navy)}.scard .ct{font-size:11px;color:var(--ink3);margin-top:3px}.scard .goarrow{position:absolute;top:11px;right:11px;color:var(--amber);opacity:0;transition:.12s}.scard:hover .goarrow{opacity:1}
.aibox{background:linear-gradient(180deg,#fbf6ee,#fff);border:1px solid var(--amber-soft);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.aibox .aih{font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;color:var(--amber-d);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.aibox ul{margin:0;padding-left:4px;list-style:none}.aibox li{position:relative;padding:5px 0 5px 20px;font-size:14px;line-height:1.7;border-bottom:1px dashed var(--line)}.aibox li:last-child{border-bottom:none}.aibox li::before{content:"";position:absolute;left:3px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.aibox .aimeta{font-size:11px;color:var(--ink3);margin-top:10px;display:flex;gap:10px;align-items:center}
.searchbox{position:relative;margin-bottom:14px}.searchbox .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}.searchbox input{padding-left:38px}
.filtersec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}.frow:last-child{margin-bottom:0}
.flabel{font-size:12px;font-weight:700;color:var(--ink3);font-family:"Zen Maru Gothic";width:62px;flex-shrink:0}
.catpill{font-family:"Zen Maru Gothic";font-weight:500;font-size:12.5px;padding:5px 12px;border-radius:18px;border:1px solid var(--line2);background:#fff;cursor:pointer;color:var(--ink2)}.catpill:hover{border-color:var(--amber)}.catpill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line2);border-radius:9px;overflow:hidden}.seg button{border:none;background:none;font-family:"Zen Maru Gothic";font-size:12.5px;padding:6px 12px;cursor:pointer;color:var(--ink2);border-right:1px solid var(--line2)}.seg button:last-child{border-right:none}.seg button.on{background:var(--navy);color:#fff}
.qrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:12px 15px;margin-bottom:9px;cursor:pointer;transition:.12s}.qrow:hover{border-color:var(--amber);transform:translateY(-1px)}.qrow .qbody{flex:1;min-width:0}.qrow .qt{font-weight:500;font-size:14.5px}.qrow .qsub{display:flex;align-items:center;gap:8px;margin-top:5px}.qrow .qcat{font-size:10.5px;color:var(--ink3);background:var(--paper);border-radius:5px;padding:1px 7px}
.mbar{height:7px;border-radius:4px;overflow:hidden;display:flex;flex:1;max-width:150px;background:var(--paper);border:1px solid var(--line)}.mbar i{height:100%;display:block}
.ans-pill{font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:14px;white-space:nowrap}.ans-pill.full{background:var(--teal-soft);color:var(--teal-d)}.ans-pill.some{background:var(--amber-soft);color:var(--amber-d)}.ans-pill.none{background:var(--red-soft);color:var(--red)}
.typetag{font-size:10px;color:#fff;border-radius:5px;padding:1px 6px;font-weight:500}
.back{background:none;border:none;color:var(--ink2);font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;font-family:"Zen Maru Gothic"}.back:hover{color:var(--ink)}
.det-h{margin-bottom:16px}.det-h .c{font-size:12px;color:var(--ink3);background:var(--paper);border-radius:6px;padding:2px 9px;display:inline-block;margin-bottom:7px;margin-right:6px}.det-h h2{font-size:21px;line-height:1.4}.det-h .addby{font-size:11.5px;color:var(--ink3);margin-top:6px}
.alert{background:var(--red-soft);border:1px solid #f0c9bb;border-radius:var(--r);padding:14px 16px;margin-bottom:16px}.alert.done{background:var(--teal-soft);border-color:#bfe2d3}.alert .at{font-family:"Zen Maru Gothic";font-weight:700;font-size:14.5px;color:var(--red);margin-bottom:8px;display:flex;align-items:center;gap:7px}.alert.done .at{color:var(--teal-d);margin-bottom:0}.alert .chips{display:flex;gap:7px;flex-wrap:wrap}
.distwrap{margin-bottom:6px}.distbar{height:30px;border-radius:9px;overflow:hidden;display:flex;border:1px solid var(--line)}.distseg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;min-width:0}.distseg.un{background:repeating-linear-gradient(45deg,#e4ded2,#e4ded2 5px,#ece7dc 5px,#ece7dc 10px);color:var(--ink3)}
.distleg{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px}.legi{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}.legd{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.gcard{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;margin-bottom:10px;border-left-width:4px}.gcard-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}.gdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}.glabel{flex:1;font-family:"Zen Maru Gothic";font-weight:700;font-size:14.5px;word-break:break-word}.gcount{font-size:12px;color:var(--ink2);white-space:nowrap;background:var(--paper);padding:2px 9px;border-radius:12px}.gtag{font-size:10px;font-weight:700;color:#fff;background:var(--amber);border-radius:5px;padding:1px 7px}.gnote{font-size:12.5px;color:var(--ink2);margin-bottom:8px;line-height:1.6}
.gchips{display:flex;gap:6px;flex-wrap:wrap}.gch{font-size:11.5px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:2px 9px;color:var(--ink2);cursor:pointer}.gch:hover{border-color:var(--amber);color:var(--amber-d)}
.memnotes{margin-top:8px;display:flex;flex-direction:column;gap:3px}.memnote{font-size:11.5px;color:var(--ink2)}.memnote b{color:var(--navy);font-weight:500}
.gmem{display:flex;gap:9px;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}.gmem:first-child{border-top:none}.gmem .gms{width:80px;flex-shrink:0;color:var(--navy);font-weight:500;cursor:pointer}.gmem .gms:hover{color:var(--amber-d)}.gmem .gmv{flex:1;white-space:pre-wrap;word-break:break-word}
.notebadge{font-size:11px;color:var(--amber-d);background:var(--amber-soft);border-radius:5px;padding:0 6px;margin-left:4px}
.numrow{display:flex;align-items:center;gap:10px;padding:5px 0}.numlab{width:80px;flex-shrink:0;font-size:13px;font-weight:500;color:var(--navy);cursor:pointer}.numlab:hover{color:var(--amber-d)}.numtrack{flex:1;height:20px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line)}.numtrack i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--navy))}.numval{width:120px;flex-shrink:0;text-align:right;font-size:12.5px}
.numstats{display:flex;gap:18px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}.numstats div{font-size:12px;color:var(--ink2)}.numstats b{display:block;font-family:"Zen Maru Gothic";font-size:16px;color:var(--navy)}
.listgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}@media(max-width:600px){.listgrid{grid-template-columns:1fr}}.listrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.listrow .ls{width:84px;flex-shrink:0;color:var(--navy);font-weight:500;cursor:pointer}.listrow .ls:hover{color:var(--amber-d)}.listrow .lv{flex:1;word-break:break-word}.listrow .lv.mono{font-family:ui-monospace,monospace;font-size:12.5px}.listrow .lv.empty{color:var(--ink3)}
.ai{background:linear-gradient(180deg,#fbf6ee,#fff);border:1px solid var(--amber-soft);border-radius:var(--r);padding:15px 17px;margin-top:16px}.ai .aih{font-family:"Zen Maru Gothic";font-weight:700;font-size:14px;color:var(--amber-d);display:flex;align-items:center;gap:7px;margin-bottom:9px}.ai .aitxt{font-size:14.5px;line-height:1.85}.ai .aimeta{font-size:11px;color:var(--ink3);margin-top:9px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--amber-soft);border-top-color:var(--amber);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
.editsec{margin-top:16px}.edit-toggle{width:100%;text-align:left;justify-content:space-between}
.arow{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}.arow:last-child{border-bottom:none}.arow .an{width:90px;flex-shrink:0;font-weight:500;font-size:13px;color:var(--navy);padding-top:2px}.arow .av{flex:1;font-size:13.5px;white-space:pre-wrap;word-break:break-word}.arow .av.empty{color:var(--ink3)}.arow .aedit{flex-shrink:0}.edbox{flex:1}.edbox textarea{margin-bottom:8px}.edrow{display:flex;gap:8px}
.ttable{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.ttable th{background:var(--navy);color:#fff;font-weight:500;padding:9px 11px;text-align:left;white-space:nowrap;font-size:12.5px}.ttable td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:top}.ttable tr:nth-child(even) td{background:#fcfaf5}.ttable .tc{color:var(--ink3);font-size:11px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.empty-note{text-align:center;color:var(--ink3);padding:30px 10px;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:0 6px 22px rgba(0,0,0,.25);opacity:0;transition:.25s;font-family:"Zen Maru Gothic"}.toast.show{opacity:1}
/* スクールビュー カード型一覧 */
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:4px}
@media(max-width:480px){.sc-grid{grid-template-columns:1fr 1fr}}
.sc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;cursor:pointer;transition:.12s}
.sc-card:hover,.sc-card:active{border-color:var(--amber);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.sc-card.sc-editing{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.sc-qlabel{font-size:11.5px;font-weight:700;color:#fff;padding:6px 10px;line-height:1.4;font-family:"Zen Maru Gothic"}
.sc-unit{font-weight:400;opacity:.85}
.sc-ans{font-size:13px;padding:9px 10px;line-height:1.55;word-break:break-word;min-height:40px}
.sc-empty{color:var(--ink3);font-style:italic;font-size:12px}
.sc-card.sc-carried{border-color:#e8d4a8;background:linear-gradient(180deg,#fffdf7,#fff)}
.sc-carry-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px 9px;border-top:1px dashed var(--line)}
.sc-carry-badge{font-size:10.5px;font-weight:700;color:var(--amber-d);background:var(--amber-soft);border:1px solid #f0d9b5;border-radius:6px;padding:2px 7px}
.sc-carry-btn{font-family:'Zen Maru Gothic';font-size:11px;font-weight:500;color:#fff;background:var(--teal);border:none;border-radius:7px;padding:4px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.sc-carry-btn:hover{background:var(--teal-d)}
/* 一括取り込み */
.imp-drop{border:2px dashed var(--line2);border-radius:12px;padding:22px 16px;text-align:center;background:#fdfbf6;cursor:pointer}
.imp-drop:hover{background:#f9f5ec;border-color:var(--amber)}
.imp-drop .ic2{color:var(--navy2);margin-bottom:6px;display:block}
.imp-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.imp-st{border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;background:#fff}
.imp-st b{display:block;font-family:'Zen Maru Gothic';font-size:20px;line-height:1.3}
.imp-st span{font-size:11.5px;color:var(--ink3)}
.imp-st.add b{color:var(--teal-d)}.imp-st.upd b{color:var(--navy)}.imp-st.err b{color:#b5453a}
.imp-err{background:#fdf0ee;border:1px solid #f0c4bd;border-radius:10px;padding:11px 13px;margin-bottom:12px}
.imp-err .eh{font-family:'Zen Maru Gothic';font-weight:700;font-size:13px;color:#a33a2e;margin-bottom:7px}
.imp-err ul{margin:0;padding-left:18px}
.imp-err li{font-size:12.5px;line-height:1.9;color:var(--ink2)}
.imp-list{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow-y:auto;margin-bottom:12px}
.imp-row{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-bottom:1px solid var(--line);font-size:12.5px}
.imp-row:last-child{border-bottom:none}
.imp-tag{flex-shrink:0;font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;margin-top:2px}
.imp-tag.add{background:var(--teal-d)}.imp-tag.upd{background:var(--navy2)}.imp-tag.same{background:#b3ada0}
.imp-diff{color:var(--amber-d);font-size:11.5px}
/* 質問一覧の出力 */
.exportbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.exportbar .btn{flex-shrink:0}
.qlist-print{display:none}
@media print{
  body{background:#fff}
  .hd,.nav,.searchbox,.filtersec,.exportbar,.back,.toast,.mask,#searchList,#scount,.qedit-bar{display:none !important}
  .wrap{max-width:none;padding:0}
  .qlist-print{display:block}
  .qlist-print h1{font-family:'Zen Maru Gothic';font-size:16pt;margin-bottom:2mm;color:#000}
  .qlist-print .pmeta{font-size:8.5pt;color:#444;margin-bottom:4mm}
  .qlist-print table{width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed}
  .qlist-print th,.qlist-print td{border:.4pt solid #999;padding:1.6mm 1.8mm;vertical-align:top;word-wrap:break-word;color:#000}
  .qlist-print th{background:#e8e8e8;font-weight:700;text-align:left}
  .qlist-print tr{page-break-inside:avoid}
  .qlist-print thead{display:table-header-group}
  .qlist-print .pcat{background:#f2f2f2;font-weight:700}
  @page{size:A4 landscape;margin:10mm}
}
/* 質問の設定を編集 */

const API_URL='https://script.google.com/macros/s/AKfycbwHHo_hU66Wcs0rEyCOPchFwG4kNJaNQG6Vbw3tGDlRTDY_SQHcOS8IdUNFMbSNj9ll/exec'; // 例: 'https://script.google.com/macros/s/XXXXXXXX/exec'

/* ===== 画面遷移とスクロール位置の記憶 =====
   進むとき（navPush）に「今いる画面＋スクロール位置」を積み、
   戻るとき（navBack / navBackTo）にその位置へ復元します。
   その画面から来ていない場合は積まれていないので、常に最上部から表示されます。 */
function curY(){return window.scrollY||window.pageYOffset||(document.documentElement&&document.documentElement.scrollTop)||0}
function pageKey(){
  if(ST.view==='school')return 'school:'+ST.school;
  if(ST.view==='detail')return 'detail:'+ST.q;
  if(ST.view==='flowpick')return 'flowpick:'+ST.flowPick;
  if(ST.view==='qedit')return 'qedit:'+ST.qEdit;
  return ST.view;
}
function applyKey(k){
  const i=k.indexOf(':'),v=i<0?k:k.slice(0,i),arg=i<0?null:k.slice(i+1);
  ST.editing=null;ST.schoolEditing=null;ST.flow=null;
  if(v==='school'){ST.school=arg;ST.view='school'}
  else if(v==='detail'){ST.q=arg;ST.view='detail';ST.showEdit=false}
  else if(v==='flowpick'){ST.flowPick=arg;ST.view='flowpick'}
  else if(v==='qedit'){ST.qEdit=arg;ST.view='qedit'}
  else ST.view=v;
}
function navPush(){ST.navStack.push({k:pageKey(),y:curY()});if(ST.navStack.length>40)ST.navStack.shift()}
function navReset(){ST.navStack=[]}
function navBackTo(key){for(let i=ST.navStack.length-1;i>=0;i--){if(ST.navStack[i].k===key){const y=ST.navStack[i].y;ST.navStack.length=i;return y}}return null}
function navLabel(fb){

  if(v==='home')return 'ホーム（学校一覧）へ戻る';
  if(v==='search')return '質問一覧へ戻る';
  if(v==='table')return '回答テーブルへ戻る';
  if(v==='add')return '質問を追加へ戻る';

function navBack(fb){
  if(ST.navStack.length){const e=ST.navStack.pop();applyKey(e.k);render({restoreScroll:e.y});return}

function openSchool(sid){

function sortedSel(v){return selVals(v).map(nrm).sort().join(' / ')}
function fmtMan(n){return n>=10000?(n/10000).toLocaleString(undefined,{maximumFractionDigits:1})+'万':n.toLocaleString()}
function schoolDiffs(sid){
  const out=[];
  ST.questions.forEach(q=>{
    if(!isTargetSchool(sid,q.id))return;
    const a=getAns(sid,q.id);if(!a)return;
    const ent=targetSchools(q.id).map(s=>({s,a:getAns(s.id,q.id)})).filter(x=>x.a);
    if(ent.length<4)return;
    const choice=isChoice(q.id),t=qType(q.id);
    if(choice||t==='categorical'){
      const m={};ent.forEach(x=>{const k=choice?sortedSel(x.a.v):nrm(x.a.v);if(!k)return;(m[k]=m[k]||{label:x.a.v,n:0});m[k].n++});
      const arr=Object.keys(m).map(k=>({k:k,label:m[k].label,n:m[k].n})).sort((p,r)=>r.n-p.n);
      if(!arr.length)return;
      const mineK=choice?sortedSel(a.v):nrm(a.v);
      const top=arr[0];const mineN=(m[mineK]||{n:0}).n;
      if(top.k!==mineK&&top.n>mineN){
        out.push({q:q,kind:mineN<=1?'only':'minor',mine:a.v,topLabel:top.label,topN:top.n,answered:ent.length,mineN:mineN});
      }
    }else if(t==='numeric'){
      const isPct=isPercentQ(q.id);const pf=isPct?pctNum:pnum;
      const nums=ent.map(x=>({n:pf(x.a.v)})).filter(x=>x.n!=null);
      if(nums.length<4)return;
      const mineNum=pf(a.v);if(mineNum==null)return;
      const sorted=nums.map(x=>x.n).sort((p,r)=>r-p);
      const avg=sorted.reduce((p,r)=>p+r,0)/sorted.length;
      const isMax=sorted[0]===mineNum&&sorted.filter(n=>n===mineNum).length===1;
      const isMin=sorted[sorted.length-1]===mineNum&&sorted.filter(n=>n===mineNum).length===1;
      const ratio=avg?mineNum/avg:1;
      if(isMax||isMin||ratio>=1.6||ratio<=0.6){
        const rank=sorted.indexOf(mineNum)+1;
        out.push({q:q,kind:'num',mine:isPct?fmtPct(mineNum):a.v,avg:avg,rank:rank,answered:nums.length,isPct:isPct,label:isMax?'最も高い':isMin?'最も低い':(ratio>=1.6?'平均より高め':'平均より低め')});
      }
    }
  });
  const rk={only:0,minor:1,num:2};
  out.sort((p,r)=>{if(rk[p.kind]!==rk[r.kind])return rk[p.kind]-rk[r.kind];return (r.topN||0)/(r.answered||1)-(p.topN||0)/(p.answered||1)});
  return out;
}

function flowQs(sid,cat,mode){return ST.questions.filter(q=>isTargetSchool(sid,q.id)&&(cat==='__all__'||q.category===cat)&&(mode==='all'||!getConfirmedAns(sid,q.id)))}

function setFilter(kind,val){const y=window.scrollY||0;if(kind==='cat')ST.s_cat=val;else if(kind==='status')ST.s_status=val;else if(kind==='sort')ST.s_sort=val;render({keepScroll:true});setTimeout(()=>window.scrollTo(0,y),20)}
function searchList(){
  let list=ST.questions.map(q=>{const c=qCounts(q.id);return {q,a:c.conf,n:c.n,u:c.car+c.blank,c:c}});const kw=ST.s_text.trim().toLowerCase();
  if(kw)list=list.filter(x=>x.q.text.toLowerCase().includes(kw)||x.q.category.toLowerCase().includes(kw));

  if(ST.s_sort==='todo')list.sort((a,b)=>b.u-a.u);else if(ST.s_sort==='new')list.sort((a,b)=>b.q.createdAt-a.q.createdAt);

function distHTML(groups,unN,total){const N=total||(groups.reduce((a,g)=>a+g.n,0)+(unN||0))||1;return `<div class="distwrap"><div class="distbar">${groups.map((g,i)=>`<div class="distseg" style="width:${g.n/N*100}%;background:${GCOL[i%GCOL.length]}" title="${g.n}校">${g.n/N>=.1?g.n:''}</div>`).join('')}${unN?`<div class="distseg un" style="width:${unN/N*100}%">${unN/N>=.1?unN:''}</div>`:''}</div><div class="distleg">${groups.map((g,i)=>`<span class="legi"><span class="legd" style="background:${GCOL[i%GCOL.length]}"></span>${esc(g.label.length>16?g.label.slice(0,16)+'…':g.label)}（${g.n}）</span>`).join('')}${unN?`<span class="legi"><span class="legd" style="background:#e4ded2"></span>未回答（${unN}）</span>`:''}</div></div>`}
function memNotesHTML(members){const wn=members.filter(m=>m.note);return wn.length?`<div class="memnotes">${wn.map(m=>`<div class="memnote"><b>${esc(m.short)}</b>：${esc(m.note)}</div>`).join('')}</div>`:''}
function renderViz(q,an){
  if(isChoice(q.id))return renderChoiceViz(q,an);

  if(an.type==='numeric'){
    const isPct=an.isPct;

    const txtRows=(isPct&&an.textOnly&&an.textOnly.length)?an.textOnly.map(e=>`<div class="numrow"><div class="numlab"${edClick("startEdit('"+e.id+"')")}>${esc(e.short)}</div><div class="numval" style="text-align:left;flex:1;color:var(--ink3)">${esc(e.v)||'不明'}${e.note?` <span class="notebadge">備考: ${esc(e.note)}</span>`:''}</div></div>`).join(''):'';

  if(an.type==='list'||an.type==='contact'){const mono=an.type==='contact'?'mono':'';return `<div class="sec-h"><span class="ic">${I.table}</span>各校の回答</div><div class="listgrid">${SCHOOLS.map(s=>{const on=isTargetSchool(s.id,q.id);const a=on?getAns(s.id,q.id):null;return `<div class="listrow${on?'':' offrow'}"><span class="ls"${on?edClick("startEdit('"+s.id+"')"):''}>${esc(s.short)}</span><span class="lv ${mono} ${a?'':'empty'}">${on?(a?esc(a.v)+noteBadge(a):'— 未回答'):'— 対象外'}</span></div>`}).join('')}</div>`;}

/* 未回答と「前年度のまま」を分けて表示する。
   前年度のままの学校はグラフにも出ているため、未回答に含めると二重に見えてしまう。 */
function statusAlertHTML(qid,an){
  const N=targetSchools(qid).length,blank=an.blank||[],carr=an.carried||[];
  if(!blank.length&&!carr.length)
    return `<div class="alert done"><div class="at">${I.check} 対象${N}校すべてから今年度の回答が集まっています</div></div>`;
  const chips=(arr,cls,suf)=>`<div class="chips">${arr.map(s=>`<span class="chip ${cls}"${edClick("startEdit('"+s.id+"')")}>${esc(s.short)}${suf}</span>`).join('')}</div>`;
  let h=`<div class="alert">`;
  if(blank.length){
    h+=`<div class="at">${I.bell} 未回答の学校が ${blank.length}校 あります（対象 ${N}校）</div>`;
    if(canEdit())h+='<p class="tiny muted" style="margin-bottom:9px">学校名をタップするとその場で回答できます。</p>';
    h+=chips(blank,'warn',canEdit()?' に回答 ＋':'');
  }

var QCOLS=['question_id','カテゴリ','並び順','質問','回答の種類','単位','選択肢','補足説明','回答例','対象区分','非表示'];

    if(na!==nb)return na-nb;
    return (Number(a.createdAt)||0)-(Number(b.createdAt)||0);
  });
}

var IMP={rows:null,errors:null,file:''};

// ---- CSVパーサ（引用符・改行・カンマを含むセルに対応）----
function parseCSV(text){
  text=String(text||'').replace(/^\ufeff/,'');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false }
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(cur);cur=''}
      else if(c==='\r'){}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else cur+=c;
    }
  }
  if(q)return {error:'引用符（"）の数が合いません。ファイルの途中で壊れている可能性があります。'};
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return {rows:rows.filter(r=>r.some(c=>String(c).trim()!==''))};
}
var IMP_TYPES=['記述','選択式','数値','一覧','連絡先'];
var IMP_TARGETS={'小 / 中':'小 / 中','小/中':'小 / 中','小・中':'小 / 中','小中':'小 / 中','両方':'小 / 中','小':'小','中':'中','小学校':'小','中学校':'中'};
function validateImport(text){
  const p=parseCSV(text);
  if(p.error)return {errors:[p.error]};
  const rows=p.rows;
  if(!rows.length)return {errors:['ファイルが空です。']};
  const head=rows[0].map(x=>String(x).trim());
  const missing=QCOLS.filter(c=>head.indexOf(c)<0);
  if(missing.length)return {errors:['列が足りません（または列名が違います）：'+missing.join('、')+'　／　「CSV（Excelで開けます）」で書き出したファイルをそのまま編集して取り込んでください。']};
  const ix={};QCOLS.forEach(c=>ix[c]=head.indexOf(c));
  const known={};ST.allQuestions.forEach(q=>known[q.id]=q);
  const errors=[],items=[],seen={};
  let auto=0;ST.allQuestions.forEach(q=>{const m=/^q(\d+)$/.exec(q.id);if(m)auto=Math.max(auto,parseInt(m[1],10))});
  let maxOrder=0;ST.allQuestions.forEach(q=>{const o=Number(q.createdAt);if(isFinite(o))maxOrder=Math.max(maxOrder,o)});
  function E(ln,msg){errors.push((ln+1)+'行目：'+msg)}
  for(let i=1;i<rows.length;i++){
    const r=rows[i],get=c=>String(r[ix[c]]==null?'':r[ix[c]]).trim();
    if(r.length!==head.length)E(i,'列数が'+r.length+'個です（見出しは'+head.length+'個）。カンマや改行の入ったセルが壊れている可能性があります。');
    const id=get('question_id'),cat=get('カテゴリ'),text2=get('質問');
    let type=get('回答の種類')||'記述',opts=get('選択肢'),tgRaw=get('対象区分')||'小 / 中',ordRaw=get('並び順');
    if(!cat)E(i,'カテゴリが空です。');
    if(!text2)E(i,'質問が空です。');
    if(text2.length>200)E(i,'質問が長すぎます（'+text2.length+'文字。200文字まで）。');
    if(IMP_TYPES.indexOf(type)<0)E(i,'回答の種類「'+type+'」は使えません（'+IMP_TYPES.join('・')+'のいずれか）。');
    if(type==='選択式'){
      opts=opts.split('/').map(x=>x.trim()).filter(Boolean).join(' / ');
      if(!opts)E(i,'回答の種類が「選択式」ですが、選択肢が空です。');
    }else opts='';
    const tg=IMP_TARGETS[tgRaw.replace(/\s+/g,'')]||IMP_TARGETS[tgRaw];
    if(!tg)E(i,'対象区分「'+tgRaw+'」は使えません（「小 / 中」「小」「中」のいずれか）。');
    let order=null;
    if(ordRaw!==''){order=Number(ordRaw);if(!isFinite(order)||order<0)E(i,'並び順「'+ordRaw+'」は0以上の数字で入力してください。')}
    if(id){
      if(!known[id])E(i,'question_id「'+id+'」は存在しません。新しく追加する場合は question_id を空にしてください。');
      if(seen[id])E(i,'question_id「'+id+'」がファイル内で重複しています（'+(seen[id]+1)+'行目と重複）。');
      seen[id]=i;
    }
    const hid=get('非表示'),hidden=/^(true|1|yes|非表示|○|x)$/i.test(hid);
    if(hid&&!hidden&&!/^(false|0|no)$/i.test(hid))E(i,'非表示「'+hid+'」は使えません（空欄にするか TRUE と入力してください）。');
    const newId=id||('q'+String(auto+1+items.filter(x=>!x.id).length).padStart(3,'0'));
    const item={id:id||'',newId:newId,category:cat,text:text2,type:type,
      unit:(type==='数値')?get('単位'):'',options:opts,hint:get('補足説明'),example:get('回答例'),
      target:tg||'小 / 中',hidden:hidden,order:order,line:i+1,
      mode:id?'update':'add'};
    if(id&&known[id]){
      const o=known[id],d=[];
      if(o.category!==item.category)d.push('カテゴリ');
      if((o.text||'')!==item.text)d.push('質問');
      if((o.type||'記述')!==item.type)d.push('種類');
      if((o.unit||'')!==item.unit)d.push('単位');
      if((o.options||'')!==item.options)d.push('選択肢');
      if((o.hint||'')!==item.hint)d.push('補足説明');
      if((o.example||'')!==item.example)d.push('回答例');
      if((o.target||'小 / 中')!==item.target)d.push('対象区分');
      if(!!o.hidden!==item.hidden)d.push('表示/非表示');
      if(item.order!=null&&Number(o.createdAt)!==item.order)d.push('並び順');
      item.diff=d;if(!d.length)item.mode='same';
      // 回答済みの質問で意味が変わる変更に注意を促す
      const c=qCounts(id);
      if((c.conf+c.car)>0&&(d.indexOf('種類')>=0||d.indexOf('選択肢')>=0))
        item.warn=(c.conf+c.car)+'校の回答あり';
    }
    if(item.order==null)item.order=(item.mode==='add')?(++maxOrder):null;
    items.push(item);
  }
  if(!items.length)errors.push('取り込める行がありません（見出し行だけのようです）。');
  return {items:items,errors:errors,head:head};
}
function onImportFile(input){
  const f=input&&input.files&&input.files[0];
  if(!f){return}
  IMP.file=f.name;
  const rd=new FileReader();
  rd.onload=()=>{handleImportText(String(rd.result||''))};
  rd.onerror=()=>{IMP.errors=['ファイルを読み込めませんでした。'];IMP.rows=null;render()};
  rd.readAsText(f,'UTF-8');
}
function handleImportText(text){
  const v=validateImport(text);
  IMP.rows=v.items||null;IMP.errors=v.errors&&v.errors.length?v.errors:null;
  render();
}
function viewImport(){
  if(!canEdit())return `<div class="card"><div class="sec-h"><span class="ic">${I.plus}</span>CSVから一括で追加・更新</div>${roNotice('取り込むには編集モードに切り替えてください。')}</div>`;
  const back=`<button class="back" onclick="navBack('search')">${I.back} ${esc(navLabel('search'))}</button>`;
  let body='';
  if(!IMP.rows&&!IMP.errors){
    body=`<div class="imp-drop" onclick="document.getElementById('impFile').click()">
      <span class="ic2">${I.table}</span>
      <div style="font-family:'Zen Maru Gothic';font-weight:700;font-size:14.5px;color:var(--navy)">CSVファイルを選ぶ</div>
      <p class="muted tiny" style="margin-top:6px">「CSV（Excelで開けます）」で書き出したファイルを編集して読み込みます</p></div>
      <input type="file" id="impFile" accept=".csv,text/csv" style="display:none" onchange="onImportFile(this)">
      <div class="qhint" style="margin-top:14px"><span class="qhi">${I.bell}</span><span>
      <b>使い方</b><br>
      ① 質問一覧の「CSV（Excelで開けます）」で書き出す<br>
      ② Excelで開いて編集する。<b>行を増やして質問を追加する場合は question_id を空欄</b>にしてください（IDは自動で振られます）<br>
      ③ CSV形式（UTF-8）のまま保存して、ここで読み込む<br><br>
      ・question_id が入っている行は、その質問の<b>更新</b>になります<br>
      ・CSVから行を削除しても、質問は消えません（非表示にしたい場合は「非表示」列に TRUE と入力してください）<br>
      ・エラーが1件でもあると、<b>1行も書き込まずに中止</b>します</span></div>`;
  }else if(IMP.errors){
    body=`<div class="imp-err"><div class="eh">${I.bell} 取り込めませんでした（${IMP.errors.length}件のエラー）</div>
      <ul>${IMP.errors.slice(0,40).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
      ${IMP.errors.length>40?`<p class="tiny muted" style="margin-top:7px">ほか ${IMP.errors.length-40} 件</p>`:''}</div>
      <p class="muted tiny" style="margin-bottom:12px">ファイルを直してから、もう一度読み込んでください。データは一切変更されていません。</p>
      <button class="btn" onclick="resetImport()">別のファイルを選ぶ</button>`;
  }else{
    const add=IMP.rows.filter(r=>r.mode==='add'),upd=IMP.rows.filter(r=>r.mode==='update'),same=IMP.rows.filter(r=>r.mode==='same');
    const rowsH=IMP.rows.map(r=>{
      const tag=r.mode==='add'?'<span class="imp-tag add">新規</span>':r.mode==='update'?'<span class="imp-tag upd">更新</span>':'<span class="imp-tag same">変更なし</span>';
      const d=r.mode==='update'?`<span class="imp-diff">（${esc(r.diff.join('・'))}を変更${r.warn?'／'+esc(r.warn):''}）</span>`:'';
      return `<div class="imp-row">${tag}<div><b>${esc(r.mode==='add'?r.newId:r.id)}</b>　${esc(r.category)}／${esc(r.text.length>36?r.text.slice(0,36)+'…':r.text)}${r.hidden?' <span class="hidbadge">非表示</span>':''}<br>${d}</div></div>`;
    }).join('');
    body=`<p class="muted tiny">${esc(IMP.file)} を読み込みました。内容を確認して「取り込む」を押してください。</p>
      <div class="imp-sum"><div class="imp-st add"><b>${add.length}</b><span>新規追加</span></div><div class="imp-st upd"><b>${upd.length}</b><span>更新</span></div><div class="imp-st"><b>${same.length}</b><span>変更なし</span></div></div>
      ${upd.some(r=>r.warn)?`<div class="qedit-warn">回答がすでに入っている質問で、<b>回答の種類や選択肢</b>が変わります。既存の回答の見え方が変わることがあります（回答自体は消えません）。</div>`:''}
      <div class="imp-list">${rowsH}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="resetImport()">やめる</button><button class="btn pri" onclick="runImport()">${I.check} ${add.length+upd.length}件を取り込む</button></div>
      ${(add.length+upd.length)?'':'<p class="tiny muted" style="margin-top:9px">変更のある行がありません。</p>'}`;
  }
  return `${back}<div class="card qedit-card"><div class="sec-h"><span class="ic">${I.plus}</span>CSVから一括で追加・更新</div>${body}</div>`;
}
function resetImport(){IMP={rows:null,errors:null,file:''};render()}
async function runImport(){
  if(!requireEdit())return;
  if(!IMP.rows||IMP.errors){toast('取り込める内容がありません');return}
  const targets=IMP.rows.filter(r=>r.mode!=='same');
  if(!targets.length){toast('変更のある行がありません');return}
  toast('取り込み中です…');
  if(USE_API){
    try{
      const r=await gas('bulkQuestions',{items:JSON.stringify(targets.map(x=>({
        id:x.id,newId:x.newId,category:x.category,text:x.text,type:x.type,unit:x.unit,
        options:x.options,hint:x.hint,example:x.example,target:x.target,
        hidden:x.hidden?'TRUE':'',order:x.order==null?'':x.order})))});
      if(!(r&&r.ok)){IMP.errors=['サーバー側で取り込めませんでした：'+((r&&r.error)||'原因不明')];IMP.rows=null;render();return}
    }catch(e){IMP.errors=['通信エラーで取り込めませんでした。データは変更されていません。'];IMP.rows=null;render();return}
  }
  targets.forEach(x=>{
    if(x.mode==='add'){
      ST.allQuestions.push({id:x.newId,category:x.category,text:x.text,type:x.type,unit:x.unit,
        options:x.options,hint:x.hint,example:x.example,target:x.target,hidden:x.hidden,createdAt:x.order});
    }else{
      const q=ST.allQuestions.find(y=>y.id===x.id);if(!q)return;
      q.category=x.category;q.text=x.text;q.type=x.type;q.unit=x.unit;q.options=x.options;
      q.hint=x.hint;q.example=x.example;q.target=x.target;q.hidden=x.hidden;
      if(x.order!=null)q.createdAt=x.order;
    }
  });
  ST.questions=ST.allQuestions.filter(q=>!q.hidden);
  if(!USE_API)await sSet('questions',ST.allQuestions);
  const nAdd=targets.filter(x=>x.mode==='add').length,nUpd=targets.length-nAdd;
  IMP={rows:null,errors:null,file:''};
  toast('取り込みました（新規'+nAdd+'件・更新'+nUpd+'件）');
  navBack('search');
}

function readAddForm(){
  let cat=document.getElementById('addCat').value;
  if(cat==='__new__'){cat=(document.getElementById('newCatName').value||'').trim();if(!cat){toast('カテゴリ名を入力してください');return null}}
  const text=(document.getElementById('addText').value||'').trim();if(!text){toast('質問の内容を入力してください');return null}
  const type=document.getElementById('addType').value;
  const optsRaw=(document.getElementById('addOpts')||{}).value||'';
  const options=(type==='選択式')?optsRaw.split('/').map(x=>x.trim()).filter(Boolean).join(' / '):'';
  if(type==='選択式'&&!options){toast('選択肢を「 / 」区切りで入力してください');return null}
  const unit=(type==='数値')?((document.getElementById('addUnit')||{}).value||'').trim():'';
  const hint=((document.getElementById('addHint')||{}).value||'').trim();
  const example=((document.getElementById('addExample')||{}).value||'').trim();
  const target=readTarget();
  if(!target){toast('小学校・中学校のどちらかにチェックを入れてください');return null}
  return {category:cat,text:text,type:type,unit:unit,options:options,hint:hint,example:example,target:target};
}
