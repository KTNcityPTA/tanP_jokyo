   GitHubに上げてみんなで共有する場合は、GASのウェブアプリURLを下の API_URL に貼ってください。
   空のままだと「この端末だけ・保存なし」のプレビュー動作になります。 */
const API_URL='https://script.google.com/macros/s/AKfycbwHHo_hU66Wcs0rEyCOPchFwG4kNJaNQG6Vbw3tGDlRTDY_SQHcOS8IdUNFMbSNj9ll/exec'; // 例: 'https://script.google.com/macros/s/XXXXXXXX/exec'
const USE_API=!!API_URL;
let MEM={};const HASSTORE=!!(window.storage&&window.storage.get);
async function gas(action,payload){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},payload||{}))});return r.json()}
async function gasGet(params){const u=API_URL+(API_URL.indexOf('?')>=0?'&':'?')+new URLSearchParams(params).toString();const r=await fetch(u);return r.json()}
async function sGet(k){if(USE_API){try{const r=await gasGet({action:'getKV',key:k});return (r&&r.ok)?(r.value==null?null:r.value):null}catch(e){return null}}if(HASSTORE){try{const r=await window.storage.get(k,true);return r?JSON.parse(r.value):null}catch(e){return null}}return MEM[k]!==undefined?MEM[k]:null}
async function sSet(k,v){if(USE_API){try{await gas('setKV',{key:k,value:v});return true}catch(e){return false}}if(HASSTORE){try{const r=await window.storage.set(k,JSON.stringify(v),true);return !!r}catch(e){console.error(e);return false}}MEM[k]=v;return true}

function cats(){return CATEGORIES.filter(c=>ST.questions.some(q=>q.category===c)).concat(ST.questions.map(q=>q.category).filter(c=>!CATEGORIES.includes(c)).filter((v,i,a)=>a.indexOf(v)===i))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function pnum(s){s=String(s).replace(/,/g,'');if(s.indexOf('@')>=0)return null;let m=s.match(/([0-9]+(?:\.[0-9]+)?)\s*万/);if(m)return parseFloat(m[1])*1e4;m=s.match(/([0-9]+(?:\.[0-9]+)?)/);return m?parseFloat(m[1]):null}
function dcount(s){return (String(s).match(/[0-9]/g)||[]).length}
function nrm(s){return String(s).replace(/\s+/g,'').toLowerCase()}
function classifyAuto(qid){const vals=SCHOOLS.map(s=>{const a=getAns(s.id,qid);return a?a.v:null}).filter(Boolean);const n=vals.length;if(!n)return 'empty';if(vals.filter(v=>v.indexOf('@')>=0).length/n>=.5||vals.filter(v=>dcount(v)>=9&&(v.indexOf('-')>=0||v.replace(/[0-9\-()\s]/g,'').length<=2)).length/n>=.5)return 'contact';const nr=vals.filter(v=>pnum(v)!=null).length/n,avg=vals.reduce((a,v)=>a+v.length,0)/n,dr=new Set(vals.map(nrm)).size/n;if(nr>=.7&&dr>=.7&&avg<=6)return 'numeric';if(dr>=.9&&avg<=8)return 'list';if(dr<=.7)return 'categorical';return 'text'}
function qType(qid){const q=ST.questions.find(x=>x.id===qid);if(q&&q.type&&TYPE_KEY[q.type])return TYPE_KEY[q.type];return classifyAuto(qid)}
function otherValues(qid,exceptSid){const seen=[];const out=[];SCHOOLS.forEach(s=>{if(s.id===exceptSid)return;const a=getAns(s.id,qid);if(a&&a.v){const k=nrm(a.v);if(!seen.includes(k)){seen.push(k);out.push(a.v)}}});return out}
function analyzeQ(qid){
  const ent=SCHOOLS.map(s=>{const a=getAns(s.id,qid);return a?{id:s.id,short:s.short,name:s.name,v:a.v,note:a.note}:null}).filter(Boolean);
  const type=qType(qid);const un=unanswered(qid);let groups=[],numeric=null;
  if(type==='numeric'){numeric=ent.map(e=>({...e,num:pnum(e.v)})).filter(e=>e.num!=null).sort((a,b)=>b.num-a.num);}
  else if(type==='categorical'){const m={};ent.forEach(e=>{const k=nrm(e.v);(m[k]=m[k]||{label:e.v,members:[]}).members.push(e)});groups=Object.values(m).sort((a,b)=>b.members.length-a.members.length);}
  return {type,ent,un,groups,numeric};
}

function sortedSel(v){return selVals(v).map(nrm).sort().join(' / ')}
function fmtMan(n){return n>=10000?(n/10000).toLocaleString(undefined,{maximumFractionDigits:1})+'万':n.toLocaleString()}
function schoolDiffs(sid){
  const out=[];
  ST.questions.forEach(q=>{
    const a=getAns(sid,q.id);if(!a)return;
    const ent=SCHOOLS.map(s=>({s,a:getAns(s.id,q.id)})).filter(x=>x.a);
    if(ent.length<4)return;
    const choice=isChoice(q.id),t=qType(q.id);
    if(choice||t==='categorical'){
      const m={};ent.forEach(x=>{const k=choice?sortedSel(x.a.v):nrm(x.a.v);if(!k)return;(m[k]=m[k]||{label:x.a.v,n:0});m[k].n++});
      const arr=Object.keys(m).map(k=>({k:k,label:m[k].label,n:m[k].n})).sort((p,r)=>r.n-p.n);
      if(!arr.length)return;
      const mineK=choice?sortedSel(a.v):nrm(a.v);
      const top=arr[0];const mineN=(m[mineK]||{n:0}).n;
      if(top.k!==mineK&&top.n>mineN){
        out.push({q:q,kind:mineN<=1?'only':'minor',mine:a.v,topLabel:top.label,topN:top.n,answered:ent.length,mineN:mineN});
      }
    }else if(t==='numeric'){
      const nums=ent.map(x=>({n:pnum(x.a.v)})).filter(x=>x.n!=null);
      if(nums.length<4)return;
      const mineNum=pnum(a.v);if(mineNum==null)return;
      const sorted=nums.map(x=>x.n).sort((p,r)=>r-p);
      const avg=sorted.reduce((p,r)=>p+r,0)/sorted.length;
      const isMax=sorted[0]===mineNum&&sorted.filter(n=>n===mineNum).length===1;
      const isMin=sorted[sorted.length-1]===mineNum&&sorted.filter(n=>n===mineNum).length===1;
      const ratio=avg?mineNum/avg:1;
      if(isMax||isMin||ratio>=1.6||ratio<=0.6){
        const rank=sorted.indexOf(mineNum)+1;
        out.push({q:q,kind:'num',mine:a.v,avg:avg,rank:rank,answered:nums.length,label:isMax?'最も高い':isMin?'最も低い':(ratio>=1.6?'平均より高め':'平均より低め')});
      }
    }
  });
  const rk={only:0,minor:1,num:2};
  out.sort((p,r)=>{if(rk[p.kind]!==rk[r.kind])return rk[p.kind]-rk[r.kind];return (r.topN||0)/(r.answered||1)-(p.topN||0)/(p.answered||1)});
  return out;
}

      <div class="flow-q">${esc(q.text)}</div>

      <label class="lb">回答${q.unit?`（単位：${esc(q.unit)}）`:''}</label>
      ${isChoice(qid)?renderSel('flow',qid,cur?cur.v:''):`<textarea class="tx" id="flowInput" rows="2" placeholder="回答を入力（他校の候補をタップしてもOK）">${esc(cur?cur.v:'')}</textarea>`}
      <label class="lb" style="margin-top:10px">備考（任意・伝えたい補足があれば）</label>
      <input class="tx" id="flowNote" placeholder="例：令和8年度から変更予定 など" value="${esc(cur?cur.note:'')}">
      <div class="flow-nav">
        ${fl.idx>0?`<button class="btn sm" onclick="flowPrev()">${I.back} 前へ</button>`:''}
        <button class="btn sm" onclick="flowSkip()">スキップ</button>
        <div style="flex:1"></div>
        <button class="btn pri" onclick="flowSave()">${fl.idx+1===total?'保存して完了':'保存して次へ'} ${I.check}</button>

    <p class="tiny muted" style="text-align:center;margin-top:12px">残り ${total-fl.idx} 問・いつでも「中断してホームへ」で終了できます</p></div>`;

function pickCand(i){const el=document.getElementById('flowInput');if(el&&window._cand){el.value=window._cand[i];el.focus()}}
function readFlowInputs(){const qid=ST.flow.queue[ST.flow.idx];const v=isChoice(qid)?(readSel('flow')||''):((document.getElementById('flowInput')||{}).value||'');const n=(document.getElementById('flowNote')||{}).value||'';return {v:v,n:n}}
async function flowSave(){const {v,n}=readFlowInputs();const qid=ST.flow.queue[ST.flow.idx];await setAns(ST.flow.sid,qid,v,n);ST.flow.idx++;render();if(ST.flow&&ST.flow.idx>=ST.flow.queue.length){} }
function flowSkip(){const {v,n}=readFlowInputs();if(v.trim()){flowSave();return}ST.flow.idx++;render()}

function flowDoneHTML(sc){return `<div class="flow"><div class="flow-card flow-done"><div class="em">🎉</div><h2 style="font-size:19px;margin-bottom:6px">${esc(sc.name)} の回答が完了しました</h2><p class="muted" style="margin-bottom:18px">ご協力ありがとうございます。AIが全校の傾向を分析します。</p><button class="btn pri lg" onclick="flowExit()">ホームへ戻る</button></div></div>`}

function viewSearch(){

function searchList(){
  let list=ST.questions.map(q=>{const a=ansCount(q.id);return {q,a,u:SCHOOLS.length-a}});const kw=ST.s_text.trim().toLowerCase();
  if(kw)list=list.filter(x=>x.q.text.toLowerCase().includes(kw)||x.q.category.toLowerCase().includes(kw));
  if(ST.s_cat!=='all')list=list.filter(x=>x.q.category===ST.s_cat);
  if(ST.s_status==='todo')list=list.filter(x=>x.a>0&&x.a<SCHOOLS.length);else if(ST.s_status==='done')list=list.filter(x=>x.a===SCHOOLS.length);else if(ST.s_status==='empty')list=list.filter(x=>x.a===0);

function distHTML(groups,unN){const N=SCHOOLS.length;return `<div class="distwrap"><div class="distbar">${groups.map((g,i)=>`<div class="distseg" style="width:${g.n/N*100}%;background:${GCOL[i%GCOL.length]}" title="${g.n}校">${g.n/N>=.1?g.n:''}</div>`).join('')}${unN?`<div class="distseg un" style="width:${unN/N*100}%">${unN/N>=.1?unN:''}</div>`:''}</div><div class="distleg">${groups.map((g,i)=>`<span class="legi"><span class="legd" style="background:${GCOL[i%GCOL.length]}"></span>${esc(g.label.length>16?g.label.slice(0,16)+'…':g.label)}（${g.n}）</span>`).join('')}${unN?`<span class="legi"><span class="legd" style="background:#e4ded2"></span>未回答（${unN}）</span>`:''}</div></div>`}
function memNotesHTML(members){const wn=members.filter(m=>m.note);return wn.length?`<div class="memnotes">${wn.map(m=>`<div class="memnote"><b>${esc(m.short)}</b>：${esc(m.note)}</div>`).join('')}</div>`:''}
function renderViz(q,an){
  if(isChoice(q.id))return renderChoiceViz(q,an);

  if(an.type==='numeric'){const max=an.numeric.length?an.numeric[0].num:1;const nums=an.numeric.map(e=>e.num);const avg=nums.reduce((a,b)=>a+b,0)/nums.length;const fmt=n=>n>=10000?(n/10000).toLocaleString(undefined,{maximumFractionDigits:1})+'万':n.toLocaleString();
    return `<div class="sec-h"><span class="ic">${I.chart}</span>各校の比較${q.unit?`（単位：${esc(q.unit)}）`:''}</div>${an.numeric.map(e=>`<div class="numrow"><div class="numlab" onclick="startEdit('${e.id}')">${esc(e.short)}</div><div class="numtrack"><i style="width:${Math.max(3,Math.round(e.num/max*100))}%"></i></div><div class="numval">${esc(e.v)}${noteBadge(e)}</div></div>`).join('')}<div class="numstats"><div>最小<b>${fmt(Math.min(...nums))}</b></div><div>平均<b>${fmt(Math.round(avg))}</b></div><div>最大<b>${fmt(Math.max(...nums))}</b></div>${an.un.length?`<div>未回答<b>${an.un.length}校</b></div>`:''}</div>`;}

  if(an.type==='categorical'){

    <div style="background:var(--amber-soft);border:1px solid #f0d9b5;border-radius:10px;padding:11px 14px;margin-bottom:12px"><div class="tiny" style="color:var(--amber-d);font-weight:500;margin-bottom:7px">括弧書きや言い回しが違っても、AIが内容で似た学校をまとめます。</div><button class="btn pri sm" id="grpbtn" onclick="genGroups('${q.id}')">${I.spark} AIで似た回答をグループ化</button></div>
    <div class="card" style="border:none;padding:0">${list}</div>${an.un.length?'<div style="margin-top:10px">'+unGroup(an.un)+'</div>':''}`;
}

async function callClaude(prompt,mt){

async function genSummary(qid){
  const q=ST.questions.find(x=>x.id===qid);const btn=document.getElementById('aibtn');const box=document.getElementById('aitxt');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> 生成中...'}if(box)box.innerHTML='<span class="muted"><span class="spin"></span> 読み込み中...</span>';
  const lines=SCHOOLS.map(s=>{const a=getAns(s.id,qid);return `・${s.name}：${a?a.v+(a.note?'（備考:'+a.note+'）':''):'（未回答）'}`}).join('\n');
  const prompt=`あなたはPTA調査をまとめる編集者です。次の項目について10校の回答を比較し、多い方式・少数派の工夫・他校と違う点・未回答状況をふまえ、少し気の利いた語り口で日本語3〜4文の要約を書いてください。箇条書き・見出しは使わず自然な文章のみ。\n\n【質問】${q.text}（${q.category}）\n【回答】\n${lines}`;
  try{const text=await callClaude(prompt);if(!text)throw 0;ST.summaries[qid]={text,t:Date.now()};await sSet('summaries_'+ST.year,ST.summaries);render();}catch(e){if(box)box.innerHTML='<span style="color:var(--red)">生成に失敗しました。もう一度お試しください。</span>';if(btn){btn.disabled=false;btn.innerHTML=I.spark+' もう一度'}}
}
async function genGroups(qid){
  const q=ST.questions.find(x=>x.id===qid);const btn=document.getElementById('grpbtn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> グループ化中...'}
  const ent=SCHOOLS.map(s=>{const a=getAns(s.id,qid);return a?`・${s.short}：${a.v}${a.note?'（備考:'+a.note+'）':''}`:null}).filter(Boolean).join('\n');
  const shorts=SCHOOLS.map(s=>s.short).join('、');
  const prompt=`次のPTA記述回答を、内容が似ているものでグループに分類してください。括弧書きの補足や言い回し・表記の違いは無視し、本質的な内容で判断します。\n出力は次の形式のJSON配列のみ（前後の説明や\`\`\`は不要）：\n[{"label":"グループ名（簡潔に）","schools":["略称",...],"note":"このグループの共通点を一文で"}]\n略称は必ず次のいずれか：${shorts}\n未回答の学校は含めない。多い順に並べる。\n\n【質問】${q.text}\n【回答】\n${ent}`;
  try{let text=await callClaude(prompt);text=text.replace(/```json|```/g,'').trim();const m=text.match(/\[[\s\S]*\]/);if(m)text=m[0];const groups=JSON.parse(text);if(!Array.isArray(groups)||!groups.length)throw 0;ST.aigroups[qid]={groups,t:Date.now()};await sSet('aigroups_'+ST.year,ST.aigroups);render();toast('AIがグループ化しました');}
  catch(e){console.error(e);if(btn){btn.disabled=false;btn.innerHTML=I.spark+' もう一度試す'}toast('グループ化に失敗しました')}
}
/* ---- HOME ANALYSIS ---- */
function analysisDigest(){
  const lines=[];
  ST.questions.forEach(q=>{
    const t=qType(q.id);const ent=SCHOOLS.map(s=>({s,a:getAns(s.id,q.id)})).filter(x=>x.a);
    if(ent.length<4)return;
    if(t==='categorical'){const m={};ent.forEach(x=>{const k=nrm(x.a.v);(m[k]=m[k]||{label:x.a.v,sch:[]}).sch.push(x.s.short)});const gs=Object.values(m).sort((a,b)=>b.sch.length-a.sch.length);lines.push(`「${q.text}」: `+gs.map(g=>`${g.label}(${g.sch.join('・')})`).join(' / '));}
    else if(t==='numeric'){const ns=ent.map(x=>({short:x.s.short,n:pnum(x.a.v),v:x.a.v})).filter(x=>x.n!=null).sort((a,b)=>b.n-a.n);if(ns.length>=4)lines.push(`「${q.text}」(数値): 多い順 `+ns.slice(0,3).map(x=>`${x.short}:${x.v}`).join('、')+` … 最少 ${ns[ns.length-1].short}:${ns[ns.length-1].v}`);}
  });
  return lines.join('\n');
}
async function genHomeAnalysis(force){
  const totalAns=SCHOOLS.reduce((a,s)=>a+schoolCount(s.id),0);
  if(totalAns<20){return}
  if(ST.analyzing)return;ST.analyzing=true;if(ST.view==='home')render();
  const digest=analysisDigest();
  const prompt=`以下はPTA${SCHOOLS.length}校の調査データの要約です。保護者にとって興味深い「気づき」を5〜7個、特に【ある1校だけ他校と違う点】【多数派と少数派の対比】【数値が突出している学校】に注目して挙げてください。各項目は学校名を具体的に入れて1〜2文、親しみやすい日本語に。出力は「・」で始まる箇条書きのみ。前置き・まとめ文は不要。\n\n${digest}`;
  try{let text=await callClaude(prompt,1400);const items=text.split('\n').map(l=>l.replace(/^[・\-*\s]+/,'').trim()).filter(l=>l.length>3);ST.homeAnalysis={items,t:Date.now()};await sSet('home_analysis_'+ST.year,ST.homeAnalysis);}
  catch(e){console.error(e);if(force)toast('分析に失敗しました')}
  ST.analyzing=false;if(ST.view==='home')render();
}
function maybeAnalyze(){if(!ST.homeAnalysis){const totalAns=SCHOOLS.reduce((a,s)=>a+schoolCount(s.id),0);if(totalAns>=20)genHomeAnalysis(false)}}
/* ---- TABLE ---- */
function viewTable(){
  const rows=[];ST.questions.forEach(q=>SCHOOLS.forEach(s=>{const a=getAns(s.id,q.id);if(a&&(ST.tFilter==='all'||ST.tFilter===s.id))rows.push({short:s.short,cat:q.category,q:q.text,v:a.v,note:a.note,t:a.t})}));rows.sort((a,b)=>b.t-a.t);
  return `<div class="toolbar"><div class="sec-h" style="margin:0">${I.table} 回答テーブル</div><div style="flex:1"></div><select class="tx" style="width:auto" onchange="ST.tFilter=this.value;render()"><option value="all" ${ST.tFilter==='all'?'selected':''}>全校</option>${SCHOOLS.map(s=>`<option value="${s.id}" ${ST.tFilter===s.id?'selected':''}>${esc(s.short)}</option>`).join('')}</select><button class="btn sm" onclick="exportCSV()">CSVで書き出し</button></div>
    <p class="muted tiny" style="margin-bottom:12px">各校が回答・更新するたびに1行ずつ記録されます（${ST.year}年度・${rows.length}件、新しい順）。</p>
    <div style="overflow-x:auto"><table class="ttable"><thead><tr><th>学校</th><th>カテゴリ</th><th>質問</th><th>回答</th><th>備考</th><th>更新</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="white-space:nowrap;font-weight:500">${esc(r.short)}</td><td class="tc" style="white-space:nowrap">${esc(r.cat)}</td><td style="min-width:120px">${esc(r.q)}</td><td style="min-width:150px">${esc(r.v)}</td><td class="tc" style="min-width:90px">${esc(r.note||'')}</td><td class="tc" style="white-space:nowrap">${fmtDate(r.t)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<p class="empty-note">まだ回答がありません。</p>'}`;
}
function exportCSV(){const rows=[['年度','学校','カテゴリ','質問','回答','備考','更新']];ST.questions.forEach(q=>SCHOOLS.forEach(s=>{const a=getAns(s.id,q.id);if(a)rows.push([ST.year,s.name,q.category,q.text,a.v,a.note||'',new Date(a.t).toLocaleString('ja-JP')])}));const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='交野市PTA_'+ST.year+'.csv';a.click();URL.revokeObjectURL(u)}
/* ---- ADD ---- */
function viewAdd(){const cs=cats();return `<div class="card" style="max-width:560px;margin:0 auto"><div class="sec-h"><span class="ic">${I.plus}</span>新しい質問を追加</div><p class="muted tiny" style="margin-bottom:16px">追加した質問は全校で共有されます。だれが追加したか記録され、トップにも表示されます。</p>
  <label class="lb">カテゴリ</label><select class="tx" id="addCat" onchange="toggleNewCat()" style="margin-bottom:12px">${cs.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}<option value="__new__">＋ 新しいカテゴリを作る</option></select>
  <div id="newCatWrap" style="display:none;margin-bottom:12px"><label class="lb">新しいカテゴリ名</label><input class="tx" id="newCatName" placeholder="例：登下校・安全"></div>
  <label class="lb">回答の種類</label><select class="tx" id="addType" onchange="toggleAddType()" style="margin-bottom:12px"><option value="記述">記述（自由記述・AIグループ化）</option><option value="選択式">選択式（ボタンで選ぶ・複数選択可）</option><option value="数値">数値</option><option value="一覧">一覧（氏名など）</option><option value="連絡先">連絡先</option></select>
  <div id="addOptsWrap" style="display:none;margin-bottom:12px"><label class="lb">選択肢（「 / 」で区切る）</label><input class="tx" id="addOpts" placeholder="例：あり / なし　または　口座引落し / 振込 / 現金徴収"><p class="selmulti-hint">「あり / なし」だけにすると“今年度の方針で択一”の質問になります。それ以外は複数選択になります。選択肢はスプレッドシートに保存され、後からシート上で自由に編集できます。</p></div>
  <div id="addUnitWrap" style="display:none;margin-bottom:12px"><label class="lb">単位（数値の場合）</label><input class="tx" id="addUnit" placeholder="例：万円 ／ 人 ／ 回 ／ ％ ／ 家庭"></div>
  <label class="lb">質問の内容</label><input class="tx" id="addText" placeholder="例：登校班の編成方法は？" style="margin-bottom:14px">
  <div class="frow" style="gap:10px"><div style="flex:1"><label class="lb">追加した学校</label><select class="tx" id="addSchool">${SCHOOLS.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select></div><div style="flex:1"><label class="lb">お名前</label><input class="tx" id="addName" placeholder="例：田中"></div></div>
  <div style="margin-top:16px"><button class="btn pri" onclick="addQuestion()">${I.plus} この質問を追加する</button></div></div>`}
function toggleNewCat(){document.getElementById('newCatWrap').style.display=document.getElementById('addCat').value==='__new__'?'block':'none'}
function toggleAddType(){const t=document.getElementById('addType').value;const w=document.getElementById('addOptsWrap');if(w)w.style.display=(t==='選択式')?'block':'none';const u=document.getElementById('addUnitWrap');if(u)u.style.display=(t==='数値')?'block':'none'}
async function addQuestion(){
  let cat=document.getElementById('addCat').value;
  if(cat==='__new__'){cat=(document.getElementById('newCatName').value||'').trim();if(!cat){toast('カテゴリ名を入力してください');return}}
  const text=(document.getElementById('addText').value||'').trim();if(!text){toast('質問の内容を入力してください');return}
  const type=document.getElementById('addType').value;
  const optsRaw=(document.getElementById('addOpts')||{}).value||'';
  const options=(type==='選択式')?optsRaw.split('/').map(x=>x.trim()).filter(Boolean).join(' / '):'';
  if(type==='選択式'&&!options){toast('選択肢を「 / 」区切りで入力してください');return}
  const unit=(type==='数値')?((document.getElementById('addUnit')||{}).value||'').trim():'';
  const addedSchool=document.getElementById('addSchool').value;const addedName=(document.getElementById('addName').value||'').trim();
  const id='q'+Date.now().toString(36);
  const q={id:id,category:cat,text:text,type:type,unit:unit,options:options,addedSchool:addedSchool,addedName:addedName,createdAt:Date.now()};
  if(USE_API){
    try{const r=await gas('addQuestion',{id:id,category:cat,text:text,type:type,unit:unit,options:options,addedSchool:addedSchool,addedName:addedName});if(!(r&&r.ok)){toast('追加に失敗: '+((r&&r.error)||''));return}q.createdAt=r.createdAt||q.createdAt;ST.questions.push(q);}
    catch(e){toast('追加に失敗しました（通信エラー）');return}
  }else{ST.questions.push(q);await sSet('questions',ST.questions);}
  toast('質問を追加しました');openQ(id);
}
(async function(){
  render(); // ローディング画面を即座に表示
  await seedIfNeeded();await loadYear();
  ST.loading=false;
  render();maybeAnalyze();
})();
</script></body></html>
