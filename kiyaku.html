<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交野市PTA 会則・細則 くらべる板</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#f4f0e6;--surface:#fff;--ink:#2b2a26;--ink2:#6f6a60;--ink3:#a39d91;
 --line:#e7e1d4;--line2:#d9d2c2;
 --navy:#2d445f;--navy2:#3f5d83;--navy-soft:#e5ebf2;
 --amber:#d98a3c;--amber-d:#a9631d;--amber-soft:#f8ead4;
 --teal:#3a9d7e;--teal-d:#2c7a61;--teal-soft:#e1efe9;
 --red:#c65f45;--red-soft:#f7e2da;
 --seal:#b4472f;
 --r:15px;--r-s:11px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Zen Maru Gothic",sans-serif}
.mincho{font-family:"Shippori Mincho",serif}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}
/* header */
.hd{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.hd-in{max-width:940px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Zen Maru Gothic";font-weight:700;font-size:16.5px;letter-spacing:.02em}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--seal);display:flex;align-items:center;justify-content:center;font-family:"Shippori Mincho";font-weight:700;color:#fff;font-size:15px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.hd .sub{font-size:11.5px;color:#c4cfdd;font-weight:400;font-family:"Noto Sans JP"}
.axiswrap{display:flex;align-items:center;gap:7px;margin-left:auto}
.axiswrap .al{font-size:11px;color:#a9b7c8;font-family:"Zen Maru Gothic";white-space:nowrap}
.axissel{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:6px 10px;font-size:13px;font-family:"Zen Maru Gothic";font-weight:500;cursor:pointer}
.axissel option{color:#222}
.warnbar{background:var(--amber-soft);border:1px solid #eacfaa;color:var(--amber-d);border-radius:11px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.nav{background:#26394f}.nav-in{max-width:940px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.navbtn{background:none;border:none;color:#c1ccda;font-family:"Zen Maru Gothic";font-weight:500;font-size:14px;padding:11px 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.navbtn:hover{color:#fff}.navbtn.on{color:#fff;border-bottom-color:var(--amber)}
.page{padding:22px 0 80px}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.muted{color:var(--ink2)}.tiny{font-size:12px}.mb0{margin-bottom:0}
.sec-h{font-family:"Zen Maru Gothic";font-weight:700;font-size:17px;margin:0 0 13px;display:flex;align-items:center;gap:9px}.sec-h .ic{color:var(--amber);display:flex}
.btn{font-family:"Zen Maru Gothic";font-weight:500;font-size:14px;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);transition:.13s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#faf7f0;border-color:var(--ink3)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#fff}.btn.pri:hover{background:var(--amber-d);border-color:var(--amber-d)}
.btn.nv{background:var(--navy);border-color:var(--navy);color:#fff}.btn.nv:hover{background:var(--navy2)}
.btn.sm{font-size:12.5px;padding:6px 12px}
/* hero */
.hero{background:linear-gradient(175deg,#fff,#fbf7ef);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"約";position:absolute;right:-14px;bottom:-30px;font-family:"Shippori Mincho";font-weight:700;font-size:150px;color:rgba(180,71,47,.05);line-height:1;pointer-events:none}
.hero h2{font-size:21px;margin-bottom:6px;line-height:1.4;position:relative}
.hero .lead{font-size:14px;color:var(--ink2);max-width:640px;position:relative}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 15px;min-width:96px}
.stat b{font-family:"Zen Maru Gothic";font-size:24px;font-weight:700;color:var(--navy);display:block;line-height:1.15}
.stat span{font-size:11.5px;color:var(--ink2)}
.stat.hl b{color:var(--seal)}
/* AI summary */
.aibox{background:linear-gradient(180deg,#fbf5eb,#fff);border:1px solid var(--amber-soft);border-radius:var(--r);padding:17px 19px;margin-bottom:16px}
.aibox .aih{font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;color:var(--amber-d);display:flex;align-items:center;gap:8px;margin-bottom:11px}
.aibox .airow{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.aibox .airow:last-child{border-bottom:none}
.aibox .aitag{flex-shrink:0;font-size:11px;font-weight:700;font-family:"Zen Maru Gothic";border-radius:7px;padding:3px 9px;white-space:nowrap;margin-top:1px}
.aitag.common{background:var(--teal-soft);color:var(--teal-d)}
.aitag.uniq{background:var(--red-soft);color:var(--red)}
.aitag.mix{background:var(--navy-soft);color:var(--navy2)}
.aibox .aitx{font-size:13.5px;line-height:1.7}
.aibox .aimeta{font-size:11px;color:var(--ink3);margin-top:11px}
/* filter bar */
.filt{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 14px}
.filt .fl{font-size:12px;font-weight:700;color:var(--ink3);font-family:"Zen Maru Gothic"}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:none;background:none;font-family:"Zen Maru Gothic";font-size:12.5px;padding:7px 13px;cursor:pointer;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:none}.seg button.on{background:var(--navy);color:#fff}
/* topic card */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;transition:.13s}
.tcard.uniq{border-color:#e7c3b3}
.tcard-main{padding:15px 18px;cursor:pointer}
.tcard-main:hover{background:#fdfbf6}
.tmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.chchip{font-size:11px;color:var(--navy2);background:var(--navy-soft);border-radius:6px;padding:2px 9px;font-weight:500;white-space:nowrap}
.saisoku-chip{font-size:11px;color:var(--amber-d);background:var(--amber-soft);border:1px solid #eacfaa;border-radius:6px;padding:2px 9px;font-weight:500;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.saisoku-chip:hover{background:#f3ddba}
.mark{font-size:10.5px;font-weight:700;font-family:"Zen Maru Gothic";border-radius:6px;padding:2px 9px;white-space:nowrap}
.mark.uniq{background:var(--seal);color:#fff}.mark.minor{background:var(--amber);color:#fff}.mark.common{background:var(--teal);color:#fff}
.ttitle{font-family:"Zen Maru Gothic";font-weight:700;font-size:16.5px;line-height:1.4;margin-bottom:4px}
.tai{font-size:13px;color:var(--ink2);line-height:1.65;margin-bottom:12px}
/* stance rows */
.stance{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.stance:first-of-type{border-top:none}
.sdot{width:11px;height:11px;border-radius:50%;margin-top:6px;flex-shrink:0}
.sbody{flex:1;min-width:0}
.slabel{font-size:13.5px;font-weight:500;line-height:1.55;margin-bottom:5px}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-size:12px;font-family:"Zen Maru Gothic";font-weight:700;min-width:26px;height:26px;padding:0 7px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line2);color:var(--ink2)}
.bdg.ax{background:var(--seal);color:#fff;border-color:var(--seal);box-shadow:0 1px 4px rgba(180,71,47,.3)}
.scount{font-size:11.5px;color:var(--ink3);white-space:nowrap;margin-top:6px;flex-shrink:0}
/* agreement meter */
.meter{display:flex;height:8px;border-radius:5px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.meter i{height:100%;display:block}
.expander{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:var(--paper);border-top:1px solid var(--line);cursor:pointer;font-family:"Zen Maru Gothic";font-size:12.5px;color:var(--navy2);font-weight:500}
.expander:hover{background:#efe9dc}
/* detail table */
.detail{padding:4px 18px 16px;background:#fcfaf5;border-top:1px solid var(--line)}
.drow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.drow:last-child{border-bottom:none}
.drow.ax{background:linear-gradient(90deg,#fdf3ee,transparent);border-radius:8px;padding:11px 10px;margin:0 -10px;box-shadow:inset 3px 0 0 var(--seal)}
.dsch{width:96px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.dsch .nm{font-size:12.5px;font-weight:700;color:var(--navy);font-family:"Zen Maru Gothic"}
.dsch .rf{font-size:10.5px;color:var(--ink3)}
.dsch .rl{font-size:9.5px;font-weight:700;color:#fff;background:var(--seal);border-radius:5px;padding:1px 6px;width:fit-content}
.dsch .sm{font-size:9.5px;font-weight:700;color:var(--amber-d);background:var(--amber-soft);border:1px solid #eacfaa;border-radius:5px;padding:1px 6px;width:fit-content}
.dtxt{flex:1;font-size:13px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.dtxt.none{color:var(--ink3);font-style:normal}
.pending-note{margin-top:12px;font-size:12px;color:var(--ink3);background:var(--paper);border:1px dashed var(--line2);border-radius:9px;padding:8px 12px}
/* PDF list */
.pdf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.pdf-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;transition:.13s;position:relative}
.pdf-card.real{border-color:#e7c3b3;background:linear-gradient(180deg,#fffdfb,#fff)}
.pdf-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px)}
.pdf-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.pdf-ico{width:46px;height:56px;flex-shrink:0;border-radius:6px;background:linear-gradient(160deg,#fff,#f0e8d8);border:1.5px solid var(--line2);position:relative;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.pdf-ico::before{content:"";position:absolute;top:0;right:0;border-width:0 13px 13px 0;border-style:solid;border-color:var(--paper) var(--paper) var(--line2) var(--line2)}
.pdf-ico .seal{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-family:"Shippori Mincho";font-weight:700;font-size:15px;color:var(--seal);opacity:.9}
.pdf-ico .lines{position:absolute;top:12px;left:7px;right:7px;display:flex;flex-direction:column;gap:3px}
.pdf-ico .lines i{height:2px;background:var(--line2);border-radius:2px;display:block}
.pdf-ico .lines i:nth-child(2){width:70%}.pdf-ico .lines i:nth-child(4){width:55%}
.pdf-name{font-family:"Zen Maru Gothic";font-weight:700;font-size:14.5px;line-height:1.35}
.pdf-badge{font-size:10px;font-weight:700;border-radius:6px;padding:1px 8px;margin-top:4px;display:inline-block}
.pdf-badge.real{background:var(--red-soft);color:var(--seal)}
.pdf-badge.samp{background:var(--paper);color:var(--ink3);border:1px solid var(--line2)}
.pdf-actions{display:flex;flex-direction:column;gap:7px}
.pdf-btn{font-family:"Zen Maru Gothic";font-size:12.5px;font-weight:500;border-radius:9px;padding:8px 11px;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);display:flex;align-items:center;gap:7px;text-decoration:none;transition:.12s}
.pdf-btn:hover{background:#faf7f0;border-color:var(--ink3)}
.pdf-btn.full{background:var(--navy);border-color:var(--navy);color:#fff}.pdf-btn.full:hover{background:var(--navy2)}
.pdf-btn.dim{opacity:.5;cursor:not-allowed}.pdf-btn.dim:hover{background:#fff;border-color:var(--line2)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,25,20,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:16px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;transform:translateY(10px);transition:.2s}
.modal-bg.show .modal{transform:none}
.modal-h{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:2}
.modal-h .mt{font-family:"Zen Maru Gothic";font-weight:700;font-size:16px;flex:1}
.modal-h .mx{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-h .mx:hover{background:rgba(255,255,255,.28)}
.modal-body{padding:22px 26px 30px;max-height:calc(100vh - 130px);overflow-y:auto}
.doc-note{background:var(--amber-soft);border:1px solid #eacfaa;border-radius:9px;padding:9px 13px;font-size:12px;color:var(--amber-d);margin-bottom:18px;display:flex;gap:7px;align-items:flex-start}
.doc-ch{font-family:"Shippori Mincho";font-weight:700;font-size:15px;color:var(--seal);margin:20px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--amber-soft)}
.doc-ch:first-child{margin-top:0}
.doc-art{margin-bottom:13px}
.doc-art .an{font-family:"Zen Maru Gothic";font-weight:700;font-size:13.5px;color:var(--navy);margin-bottom:2px}
.doc-art .at{font-size:13px;line-height:1.85;color:var(--ink);white-space:pre-wrap}
.doc-empty{text-align:center;color:var(--ink3);padding:40px 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .ld{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 19px;border-radius:11px;font-size:13.5px;z-index:200;box-shadow:0 6px 22px rgba(0,0,0,.25);opacity:0;transition:.25s;font-family:"Zen Maru Gothic"}
.toast.show{opacity:1}
.empty-note{text-align:center;color:var(--ink3);padding:34px 10px;font-size:14px}
@media(max-width:560px){.dsch{width:78px}.hero h2{font-size:19px}}

table.mx{border-collapse:collapse;font-size:13px;min-width:640px}
table.mx th,table.mx td{border:1px solid var(--line);padding:7px 9px;text-align:center;white-space:nowrap}
table.mx th{background:#f3efe6;font-weight:700;font-size:12px}
table.mx th .req{display:block;font-style:normal;font-size:10px;color:#b4472f;font-weight:600}
table.mx td.sticky,table.mx th.sticky{position:sticky;left:0;background:#fff;text-align:left}
table.mx th.sticky{background:#f3efe6}
table.mx tr.ax td{background:#fdf6f3}
table.mx tr.ax td.sticky{background:#fdf6f3}
table.mx td.ok{color:#3a9d7e;font-weight:700}
table.mx td.ng{color:#b4472f;font-weight:700;background:#fbf0ed}
table.mx td.na{color:#c9c2b4}
table.mx td.ref{color:#d98a3c;font-weight:700;background:#fdf7ee}
.misslist{display:flex;flex-direction:column;gap:8px}
.missrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.misstags i{display:inline-block;font-style:normal;font-size:12px;background:#fbf0ed;color:#b4472f;border:1px solid #eeddd8;border-radius:11px;padding:2px 9px;margin:2px 4px 2px 0}
.todos{display:flex;flex-direction:column;gap:12px}
.todo{border-left:3px solid #d98a3c;padding:2px 0 2px 11px}
.todo .tt{display:flex;align-items:center;gap:8px;font-size:14px}
.todo .tt .st{font-style:normal;font-size:11px;color:#8a7f6d;background:#f3efe6;border-radius:9px;padding:1px 8px}
.todo .td{font-size:13px;color:var(--ink2);margin-top:2px}
.todo .tw{font-size:12px;color:var(--ink3);margin-top:2px}
.schblk{margin-bottom:16px}
.schh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.schh i{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink3)}
.filelist{display:flex;flex-direction:column}
.filerow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dotted var(--line);text-decoration:none;color:inherit;font-size:13px}
.filerow:hover{background:#faf7f1}
.filerow .fk{font-weight:600;min-width:72px}
.filerow .fn{color:var(--ink2);flex:1}
.filerow .fy{color:var(--ink3);font-size:12px}
.filerow .refmark{font-style:normal;font-size:11px;color:#d98a3c;background:#fdf7ee;border-radius:9px;padding:1px 7px}

.pnoteline{font-size:11px;color:#8a7a5c;background:#fbf7ee;border-radius:6px;padding:5px 8px;margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.pnoteline svg{flex:none;margin-top:2px}
.porig{margin-left:auto;font-size:10.5px;color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;text-decoration:none;flex:none}
.porig:hover{background:#faf7f0;color:var(--ink)}
.fsec{margin-top:12px}
.fsh{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.04em;margin:0 0 6px}
.frow{margin-bottom:8px}
.frow .pdf-btn{display:inline-flex;max-width:100%}
.fry{font-size:10.5px;color:var(--ink3);margin-left:4px}
.frdocs{font-size:11px;color:var(--ink3);line-height:1.6;margin:4px 0 0 2px;display:flex;gap:5px;align-items:flex-start}
.frdocs svg{flex:none;margin-top:2px}
.frnote{font-size:11px;color:#9a7b3f;background:#fdf7e8;border-radius:6px;padding:5px 8px;margin:4px 0 0}
.doctabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.doctab{font-family:inherit;font-size:11.5px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
.doctab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dtk{font-size:10px;border-radius:4px;padding:1px 4px;background:#eaf3ee;color:#2f7a62}
.dtk.sai{background:#fbf0e2;color:#a2661f}
.doctab.on .dtk{background:rgba(255,255,255,.2);color:#fff}
.dtn{font-size:10px;opacity:.6}
.anh{font-weight:400;font-size:12px;color:var(--ink3);margin-left:4px}

.allbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:14px;display:flex;flex-direction:column;gap:9px}
.allq{width:100%;box-sizing:border-box;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;background:#fdfcf9}
.allq:focus{outline:2px solid #c9b9a2;outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:inherit;font-size:12px;padding:4px 11px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.gapchk{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;cursor:pointer}
.schrow{display:flex;flex-direction:column;gap:5px;margin:9px 0 7px}
.srow{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}

<div class="hd"><div class="hd-in">
 <div class="logo"><span class="mk mincho">約</span><span>交野市PTA 会則・細則 くらべる板<span class="sub"> ／ 単Pの見直しをらくにする</span></span></div>

<div class="toast" id="toast"></div>
<script>
/* ============================================================
   交野市PTA 会則・細則 くらべる板
   ・提出9校すべて、各校から提出された会則・細則の原本から起こした実データ
   ・星田小学校は未提出（提出され次第、同じ手順で追加できます）
   ・条文番号は学校ごとにバラバラなので、趣旨で束ねて並べています
   ・データ部（SCHOOLS / PDFS / KAI / SAI）は論点マトリクスxlsxから自動生成
     → 直すときは xlsx を直して gen_board_kaisoku.py を再実行
   ============================================================ */

/* ---- 学校（badge＝頭文字バッジ） ---- */
/* ============================================================
   交野市PTA 会則・細則 くらべる板
   データは Googleスプレッドシート「交野市PTA_単P比較DB」から
   読み込みます。HTMLの中にデータは持っていません。
   直したいときはスプレッドシートを直してください。
   ============================================================ */
const SHEET_ID='1ZetpDElLBqk2-YlH9WC0VU8RVFb8LiY9RnhroazO-14';
const SHEET_URL='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit';

let SCHOOLS=[], SUBMITTED=[], PENDING=[], SMAP={}, PDFS={}, KAI=[], SAI=[];
let LEDGER=[], TODO=[], CODE2ID={};
let ITEMS=[], PROV={}, NAME2ID={};

/* --- スプレッドシート読み込み（JSONP。CORSの設定が要らない方式） --- */
let __gvizN=0;
function gviz(sheetName){
 return new Promise((resolve,reject)=>{
  const cb='__gviz_cb_'+(__gvizN++);
  const el=document.createElement('script');
  let done=false;
  const cleanup=()=>{try{delete window[cb]}catch(e){window[cb]=undefined};el.remove()};
  window[cb]=(r)=>{
   done=true;
   try{
    const cols=r.table.cols.map((c,i)=>(c.label||c.id||('C'+i)).trim());
    const rows=r.table.rows.map(rw=>{
     const o={};
     cols.forEach((c,i)=>{const cell=rw.c&&rw.c[i];o[c]=(cell&&cell.v!=null)?cell.v:''});
     return o;
    });
    cleanup(); resolve(rows);
   }catch(e){cleanup(); reject(e)}
  };
  el.onerror=()=>{if(!done){cleanup();reject(new Error(sheetName+' を読めませんでした'))}};
  el.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?headers=1&sheet='
        +encodeURIComponent(sheetName)+'&tqx=responseHandler:'+cb;
  document.head.appendChild(el);
  setTimeout(()=>{if(!done){cleanup();reject(new Error(sheetName+' の読み込みがタイムアウトしました'))}},20000);
 });
}
const S=v=>(v==null?'':String(v)).trim();
const isTrue=v=>v===true||S(v).toUpperCase()==='TRUE';

/* --- 読み込んだ表を、板が使う形に組み立てる --- */
function buildAll(mst,led,top,stn,ans){
 SCHOOLS=mst.filter(r=>S(r['板ID'])).sort((a,b)=>(+a['表示順']||99)-(+b['表示順']||99)).map(r=>({
  id:S(r['板ID']), name:S(r['正式名称']), sname:S(r['略称']), badge:S(r['バッジ']),
  block:S(r['ブロック']), real:S(r['提出状況'])==='あり', pending:S(r['提出状況'])!=='あり',
  homes:S(r['会員家庭数【採用値】']), how:S(r['算出方法（板に表示する説明）']),
  certainty:S(r['算出の確からしさ']), fee:S(r['年会費_R8'])
 }));
 SUBMITTED=SCHOOLS.filter(s=>!s.pending);
 PENDING=SCHOOLS.filter(s=>s.pending);
 SMAP={}; SCHOOLS.forEach(s=>SMAP[s.id]=s);

 const codeToId={}; mst.forEach(r=>{if(S(r['校コード']))codeToId[S(r['校コード'])]=S(r['板ID'])});
 CODE2ID=codeToId;
 /* 会則・細則の正規化ファイル。ラベルも収録内容も 02_ファイル台帳 の列そのままで、
    HTML側では対応づけをしない（手で対応づけるとズレるため）。 */
 PDFS={}; SCHOOLS.forEach(s=>PDFS[s.id]={kaisoku:[],saisoku:[],sanko:[]});
 led.forEach(r=>{
  if(S(r['公開可否'])!=='OK')return;                 // 個人情報を含む行は出さない
  const id=codeToId[S(r['校コード'])]; if(!id||!PDFS[id])return;
  const kind=S(r['種別']), url=S(r['共有URL']); if(!url)return;
  if(kind!=='会則'&&kind!=='細則等')return;
  const docs=S(r['収録している規程']).split('／').map(x=>x.trim()).filter(x=>x&&x!=='—');
  const sub=S(r['小分類']);
  const item={label:(kind==='会則'?(sub?'会則（'+sub+'）':'会則'):(sub||docs[0]||'細則')),
              url:url, docs:docs, note:S(r['中身']), year:S(r['年度']), lid:S(r['台帳ID'])};
  if(!docs.length) PDFS[id].sanko.push(item);
  else if(kind==='会則') PDFS[id].kaisoku.push(item);
  else PDFS[id].saisoku.push(item);
 });

 const stByTopic={}; stn.forEach(r=>{
  const t=S(r['論点ID']); if(!t)return;
  (stByTopic[t]=stByTopic[t]||[]).push({id:S(r['立場ID']),ord:+r['並び順']||0,kind:S(r['色区分'])||'variant',label:S(r['立場のラベル'])});
 });
 Object.values(stByTopic).forEach(a=>a.sort((x,y)=>x.ord-y.ord));

 const ansByTopic={}; ans.forEach(r=>{
  const t=S(r['論点ID']); if(!t)return;
  (ansByTopic[t]=ansByTopic[t]||[]).push(r);
 });

 const mk=(tab)=>top.filter(r=>S(r['タブ'])===tab&&isTrue(r['公開']))
   .sort((a,b)=>(+a['表示順']||99)-(+b['表示順']||99))
   .map(r=>{
     const tid=S(r['論点ID']);
     const rows=ansByTopic[tid]||[];
     const detail={};
     rows.forEach(x=>{
      const bid=S(x['板ID']); if(!bid||!SMAP[bid]||SMAP[bid].pending)return;
      const body=S(x['本文（要約）']);
      detail[bid]={ref:S(x['条番号'])||tab,real:true,t:body||'—'};
     });
     const stances=(stByTopic[tid]||[]).map(st=>({
      kind:st.kind,label:st.label,
      schools:rows.filter(x=>S(x['立場ID'])===st.id&&SMAP[S(x['板ID'])]&&!SMAP[S(x['板ID'])].pending).map(x=>S(x['板ID']))
     })).filter(s=>s.schools.length);
     return {ch:S(r['分類']),title:S(r['タイトル（板に出る見出し）'])||S(r['タイトル']),ai:S(r['やさしい解説']),
             saisoku:S(r['関連（細則リンク）'])||null,stances,detail};
   }).filter(t=>t.stances.length);
 KAI=mk('会則'); SAI=mk('細則');
}

function fatal(msg){
 document.getElementById('page').innerHTML=
  '<div class="card" style="padding:22px"><h2 style="margin:0 0 10px">データを読み込めませんでした</h2>'
 +'<p class="lead">'+esc(msg)+'</p>'
 +'<p class="lead">スプレッドシートが「ウェブに公開」になっているかご確認ください。'
 +'シート名（01_学校マスタ／02_ファイル台帳／03_論点マスタ／04_立場マスタ／05_回答）と、1行目の見出しは変えないでください。</p>'
 +'<p><a class="pdf-btn" href="'+SHEET_URL+'" target="_blank" rel="noopener">スプレッドシートを開く</a></p></div>';
}

async function boot(){
 document.getElementById('page').innerHTML=
  '<div class="card" style="padding:26px;text-align:center"><p class="lead" style="margin:0">スプレッドシートから読み込んでいます…</p></div>';
 try{
  const [mst,led,top,stn,ans,tod,itm,prov,yoi,hina]=await Promise.all([
   gviz('01_学校マスタ'),gviz('02_ファイル台帳'),gviz('03_論点マスタ'),gviz('04_立場マスタ'),gviz('05_回答'),
   gviz('11_未確認・宿題').catch(()=>[]),gviz('12_項目マスタ').catch(()=>[]),gviz('13_条文').catch(()=>[]),
   gviz('14_よい条文').catch(()=>[]),gviz('15_ひな形').catch(()=>[])]);
  LEDGER=led; TODO=tod;
  buildAll(mst,led,top,stn,ans);
  buildItems(itm,prov);
  buildStance(stn,ans);
  buildFull(prov);
  buildYoi(yoi); buildHina(hina);
  if(!SCHOOLS.length) return fatal('01_学校マスタ に行がありません。');
  if(!ITEMS.length) return fatal('12_項目マスタ に公開中の項目がありません。');
  if(!SMAP[ST.axis]||SMAP[ST.axis].pending) ST.axis=(SUBMITTED[0]||{}).id;
  render();
 }catch(e){ fatal(e&&e.message?e.message:String(e)); }
}

/* ============ 状態 ============ */
const ST={tab:'all', onlyDiff:false, axis:'iwa', expanded:{}};

/* ============ ヘルパ ============ */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
const KINDCOL={common:'#3a9d7e',variant:'#d98a3c',uniq:'#b4472f',pending:'#cbc4b5'};
function topics(){return ST.tab==='kaisoku'?KAI:SAI}
// いま選んでいる学校（軸）のスタンスが独自/少数派/多数派か
function axisSchool(){return SMAP[ST.axis]||SMAP['iwa']}
function axisStance(tp){
 const idx=tp.stances.findIndex(s=>s.schools.includes(ST.axis));
 if(idx<0)return null;
 const st=tp.stances[idx];
 const max=Math.max(...tp.stances.map(s=>s.schools.length));
 if(st.schools.length===1)return {mark:'uniq',label:axisSchool().sname+'のみ'};
 if(st.schools.length<max)return {mark:'minor',label:'少数派'};
 return {mark:'common',label:'多数派と一致'};
}
function submittedCount(tp){const set=new Set();tp.stances.forEach(s=>s.schools.forEach(x=>set.add(x)));return set.size}

/* ============ 描画 ============ */
function renderNav(){
 const items=[['all','すべての定め'],['dia','他校と比較'],['yoi','注目の条文'],['hina','ひな形'],['pdf','会則・細則PDF'],['status','提出状況']];
 document.getElementById('nav').innerHTML=items.map(([v,l])=>`<button class="navbtn ${ST.tab===v?'on':''}" onclick="setTab('${v}')">${l}</button>`).join('');
 const sel=document.getElementById('axisSel');
 sel.innerHTML=SUBMITTED.map(s=>`<option value="${s.id}" ${s.id===ST.axis?'selected':''}>${esc(s.sname)}</option>`).join('');
 sel.disabled=(ST.tab==='pdf');
 sel.parentNode.style.opacity=(ST.tab==='pdf')?'.35':'1';
}
function setTab(v){ST.tab=v;ST.expanded={};render()}
function setAxis(v){ST.axis=v;render();window.scrollTo(0,0);toast(SMAP[v].sname+'の目線に切り替えました')}
function setOnlyDiff(v){ST.onlyDiff=v;render()}
function toggleExp(i){ST.expanded[ST.tab+i]=!ST.expanded[ST.tab+i];render()}

function render(){
 renderNav();
 document.getElementById('page').innerHTML=(ST.tab==='all')?viewAll():(ST.tab==='dia')?viewDia():(ST.tab==='yoi')?viewYoi():(ST.tab==='hina')?viewHina():(ST.tab==='status')?viewStatus():viewPDF();
}

function viewCompare(){
 const list=topics();
 const isKai=ST.tab==='kaisoku';
 const A=axisSchool();
 const doc=isKai?'会則':'細則';
 const uniq=list.filter(t=>{const s=axisStance(t);return s&&s.mark==='uniq'});
 const minor=list.filter(t=>{const s=axisStance(t);return s&&s.mark==='minor'});
 const common=list.filter(t=>{const s=axisStance(t);return s&&s.mark==='common'});

let DOCFULL={};   // 板ID -> [{doc, kind, url, arts:[{art,head,text}]}]
function buildFull(prov){
 DOCFULL={};
 const seen={};
 prov.forEach(r=>{
  if(S(r['主／副'])!=='主')return;                       // 副はほかの条の一部なので全文には出さない
  const id=CODE2ID[S(r['校コード'])]; if(!id)return;
  const doc=S(r['文書名']), art=S(r['条番号']);
  const key=id+'|'+doc+'|'+art; if(seen[key])return; seen[key]=1;
  const list=DOCFULL[id]=DOCFULL[id]||[];
  let d=list.find(x=>x.doc===doc);
  if(!d){d={doc:doc,kind:S(r['会則/細則']),url:S(r['正規化ファイルURL']),file:S(r['正規化ファイル名']),arts:[]};list.push(d)}
  d.arts.push({art:art,head:S(r['条の見出し']),text:S(r['条文全文']),note:S(r['補記'])});
 });
 Object.values(DOCFULL).forEach(list=>{
  list.sort((a,b)=>(a.kind==='会則'?0:1)-(b.kind==='会則'?0:1));
  list.forEach(d=>d.arts.sort((a,b)=>artNo(a.art)-artNo(b.art)));
 });
}
const _KAN={〇:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function artNo(a){
 const z=S(a).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
 let m=z.match(/第\s*(\d+)/); if(m)return +m[1];
 m=z.match(/第\s*([一二三四五六七八九十]+)/);
 if(m){const t=m[1];let n=0;
  if(t.indexOf('十')>=0){const p=t.split('十');n=(p[0]?_KAN[p[0]]:1)*10+(p[1]?_KAN[p[1]]:0)}
  else n=_KAN[t]||0; return n}
 return 999;
}

let STANCE={};
function buildStance(stn,ans){
 const by={}; stn.forEach(r=>{
  const t=S(r['論点ID']); if(!t)return;
  (by[t]=by[t]||[]).push({id:S(r['立場ID']),ord:+r['並び順']||0,kind:S(r['色区分'])||'variant',label:S(r['立場のラベル']),schools:[]});
 });
 Object.values(by).forEach(a=>a.sort((x,y)=>x.ord-y.ord));
 ans.forEach(r=>{
  const t=S(r['論点ID']), sid=S(r['立場ID']), bid=S(r['板ID']);
  if(!t||!sid||!bid||!by[t])return;
  const st=by[t].find(x=>x.id===sid); if(st&&SMAP[bid]&&!SMAP[bid].pending) st.schools.push(bid);
 });
 STANCE={}; Object.keys(by).forEach(t=>{const v=by[t].filter(x=>x.schools.length); if(v.length)STANCE[t]=v});
}
function buildItems(itm,prov){
 NAME2ID={}; SCHOOLS.forEach(s=>NAME2ID[s.name]=s.id);
 const codeToId=CODE2ID;
 PROV={};
 prov.forEach(r=>{
  const t=S(r['項目ID']); if(!t)return;
  const id=codeToId[S(r['校コード'])]; if(!id)return;
  (PROV[t]=PROV[t]||[]).push({id,kind:S(r['会則/細則']),doc:S(r['文書名']),art:S(r['条番号']),
    head:S(r['条の見出し']),role:S(r['主／副']),text:S(r['条文全文']),note:S(r['補記']),
    url:S(r['正規化ファイルURL']),file:S(r['正規化ファイル名'])});
 });
 const split=v=>S(v).split('／').map(x=>x.trim()).filter(x=>x&&x!=='—'&&x!=='なし').map(n=>NAME2ID[n]).filter(Boolean);
 ITEMS=itm.filter(r=>S(r['項目ID'])&&isTrue(r['公開']))
  .sort((a,b)=>(+a['表示順']||999)-(+b['表示順']||999))
  .map(r=>({id:S(r['項目ID']),major:S(r['大項目']),title:S(r['小項目（板に出る項目名）']),
    desc:S(r['概要（どんなことが定められているか）']),
    n:+r['定めている学校数']||0, cnt:+r['条文の件数']||0, avg:r['条番号の平均'],
    kai:split(r['会則に定めている学校']), sai:split(r['細則に定めている学校']),
    mik:split(r['未確認（規則本体が未提出）']), none:split(r['定めのない学校']),
    ron:S(r['対応論点ID']).split('／').filter(Boolean), yomi:S(r['読みどころ（詳しい解説）'])}));
}

/* 対応論点が複数あると同じ分かれ方が2回出るので、学校の分かれ方が同じものは1つにまとめる */
function itemStances(t){
 const seen=new Set(), out2=[];
 (t.ron||[]).forEach(r=>{
  const a=STANCE[r]; if(!a||!a.length)return;
  const sig=a.map(s=>s.schools.slice().sort().join(',')).join('|');
  if(seen.has(sig))return; seen.add(sig); out2.push(a);
 });
 return out2.length?out2[0]:[];
}

   +(()=>{const nn=t.none.filter(x=>!inStance.has(x));return nn.length?grp('non','定めがない',nn.length,
       `<div class="pnote">この項目にあたる定めが、会則にも細則にも見当たりませんでした。</div>`+chipline(nn,'non')):''})()
   +`</div>`;

 return `<div class="tcard ${t.n===1?'uniq':''}">
   <div class="tcard-main" onclick="toggleItem('${t.id}')">

      ${t.sai.length?`<div class="srow"><span class="slab sai">細則に定めている</span><span class="sch">${t.sai.map(x=>chip(x,'sai')).join('')}</span><span class="scount">${t.sai.length}校</span></div>`:''}
      ${(t.mik||[]).length?`<div class="srow"><span class="slab mik">未確認（規則が未提出）</span><span class="sch">${t.mik.map(x=>chip(x,'mik')).join('')}</span><span class="scount">${t.mik.length}校</span></div>`:''}
      ${t.none.length?`<div class="srow"><span class="slab non">定めがない</span><span class="sch">${t.none.map(x=>chip(x,'non')).join('')}</span><span class="scount">${t.none.length}校</span></div>`:''}
     </div>
     ${meter}

   <div class="expander" onclick="toggleItem('${t.id}')">${open?'条文を閉じる':`各校の条文を読む（${(PROV[t.id]||[]).length}件）`}<span>${open?I.up:I.down}</span></div>
   ${rows}
 </div>`;
}

const DIA={open:{}};
function toggleDia(k){DIA.open[k]=!DIA.open[k];render()}
function diagnose(sid){
 const lack=[], only=[], mino=[], mik=[];
 ITEMS.forEach(t=>{
  const has=t.kai.concat(t.sai).includes(sid);
  if((t.mik||[]).includes(sid)) mik.push(t);
  else if(!has) lack.push(t);
  else if(t.n===1) only.push(t);
  else if(t.n<=3) mino.push(t);
 });
 // 立場が多数派と違うもの
 const diff=[];
 ITEMS.forEach(t=>{
  const sts=itemStances(t); if(sts.length<2)return;
  const mine=sts.find(x=>x.schools.includes(sid)); if(!mine)return;
  const max=Math.max(...sts.map(x=>x.schools.length));
  if(mine.schools.length<max){
   const top=sts.filter(x=>x.schools.length===max);
   diff.push({t:t,mine:mine,top:top[0]});
  }
 });
 return {lack:lack,only:only,mino:mino,mik:mik,diff:diff};
}
function viewDia(){

   <div class="stat hl"><b>${d.lack.length}</b><span>ない定め</span></div>

 const grp=(key,label,lead,list,cls,body)=>{

 const itemLine=(t,extra)=>`<div class="dirow">

 // ない定め：他校の条文を1つ見せる
 const lackBody=()=>d.lack.sort((a,b)=>b.n-a.n).map(t=>{
   let ps=(PROV[t.id]||[]).filter(p=>p.role!=='副');

   // 「よい条文」で推薦している条文があればそれを見せる。なければ一番短いものを選ぶ

   return itemLine(t,`<div class="dichips">定めている学校：${chips}</div>`
     +(p?`<div class="diex"><div class="diexh">${esc(SMAP[p.id]?SMAP[p.id].name:'')}　${esc(p.doc)}　${esc(p.art)}
          ${rec.length&&p.id===rec[0].sid&&p.art===rec[0].art?`<span class="direc">注目の条文で紹介</span>`:`<span class="diex2">他校の書き方の一例</span>`}</div>
          <div class="diext">${esc(p.text)}</div></div>`:''));
 }).join('');

 const diffBody=()=>d.diff.map(x=>itemLine(x.t,
   `<div class="dicmp"><div class="dicmp1"><span class="dlab me">${esc(A.sname)}</span>

    </div>`)).join('');

 const ownBody=(list)=>list.map(t=>{
   const ps=(PROV[t.id]||[]).filter(p=>p.id===A.id);
   return itemLine(t, ps.map(p=>`<div class="diex"><div class="diexh">${esc(p.doc)}　${esc(p.art)}</div>
     <div class="diext">${esc(p.text)}</div></div>`).join(''));
 }).join('');

 const mikBody=()=>d.mik.map(t=>itemLine(t,
   `<div class="dinote">${I.info} 会則で「別に定める」としていますが、その規則の本体がまだ届いていません。</div>`)).join('');

 h+=grp('lack','他校にあって、'+A.sname+'にない定め',
   '定めている学校が多い順に並べています。上にあるものほど、入れておいたほうがよい定めです。',
   d.lack,'warn',lackBody);
 h+=grp('diff',A.sname+'が多数派と違う書き方をしている定め',
   '違うことが悪いわけではありません。理由があってそうしているか、見直す価値があるかを確かめる材料です。',
   d.diff,'mid',diffBody);
 h+=grp('only',A.sname+'だけが持っている定め',
   '他校が持ち帰れる可能性があるものです。会長会で紹介する価値があります。',
   d.only,'good',()=>ownBody(d.only));
 h+=grp('mino',A.sname+'を含む3校以下しか持っていない定め',
   '少数派ですが、持っていること自体は強みです。',
   d.mino,'good',()=>ownBody(d.mino));
 h+=grp('mik','規則の本体が届いていないため確認できない定め',

 if(!d.lack.length&&!d.diff.length&&!d.only.length&&!d.mik.length)
   h+=`<p class="empty-note">この学校について、特筆すべき差分はありませんでした。</p>`;

}

       <span class="pdoc">${esc(y.doc)}</span><span class="part">${esc(y.art)}</span>
       ${y.url?`<a class="porig" href="${esc(y.url)}" target="_blank" rel="noopener">ファイル</a>`:''}</div>
     <div class="ptext">${esc(y.text)}</div></div>
     ${y.item?`<div class="pnoteline">${I.info} この条文は「${esc(y.item)}」の項目に入っています。他校の書き方は「すべての定め」タブで比べられます。</div>`:''}
   </div>`:''}
 </div>`;
}

/* ---------------- ひな形 ---------------- */
const HST={doc:'',open:{}};
function setHdoc(v){HST.doc=v;render();window.scrollTo(0,0)}
function toggleH(id){HST.open[id]=!HST.open[id];render()}
function viewHina(){
 if(!HINA.length) return `<div class="card" style="padding:24px"><p class="lead">15_ひな形 が読み込めませんでした。スプレッドシートにシートがあるかご確認ください。</p></div>`;
 const docs=[]; HINA.forEach(x=>{if(!docs.includes(x.doc))docs.push(x.doc)});
 const cur=HST.doc||docs[0];
 const list=HINA.filter(x=>x.doc===cur);
 const chapters=[]; list.forEach(x=>{if(!chapters.includes(x.ch))chapters.push(x.ch)});
 const nNew=HINA.filter(x=>x.src==='（新しく書いた条文）').length;
 let h=`<div class="hero"><h2>9校の良いところを集めた、会則・細則のたたき台</h2>
  <p class="lead">市内9校の条文から良い書き方を選んで組み上げた標準版です。
  <b>1条ずつ「もとにした学校の条文」と「なぜこの書き方か」が付いています</b>ので、
  単Ｐに説明するときは、そのまま根拠として使えます。
  ○○の部分は各校の実情に合わせて埋めてください。</p>
  <div class="statrow">
   <div class="stat"><b>${HINA.length}</b><span>条・項</span></div>
   <div class="stat"><b>${docs.length}</b><span>本の規程</span></div>
   <div class="stat"><b>${HINA.filter(x=>x.need==='必須').length}</b><span>必須</span></div>
   <div class="stat hl"><b>${HINA.length-nNew}</b><span>市内に実例がある</span></div>
  </div></div>`;
 h+=`<div class="allbar"><div class="chips">`
  +docs.map(d=>`<button class="chip ${cur===d?'on':''}" onclick="setHdoc('${esc(d)}')">${esc(d)}<span class="chn">${HINA.filter(x=>x.doc===d).length}</span></button>`).join('')
  +`</div><span class="tiny muted">${list.length}条</span></div>`;
 h+=`<p class="axdesc">${I.info} <span>「もとにした学校」が<b>（新しく書いた条文）</b>のものは、市内9校のどこにも同じ定めがなく、必要と判断して書き足したものです（全体で${nNew}条）。使うかどうかは単Ｐでご判断ください。</span></p>`;
 chapters.forEach(ch=>{
  if(ch) h+=`<div class="axhead"><span class="axname">${esc(ch)}</span></div>`;
  h+=list.filter(x=>x.ch===ch).map(hinaCard).join('');
 });
 return h;
}
function hinaCard(x){
 const open=HST.open[x.id];
 const isNew=(x.src==='（新しく書いた条文）');
 return `<div class="tcard hcard">
   <div class="tcard-main" onclick="toggleH('${x.id}')">
     <div class="tmeta"><span class="hneed n-${esc(x.need)}">${esc(x.need)}</span>
       <span class="hart">${esc(x.art)}</span>
       ${isNew?`<span class="hnew">市内に実例なし</span>`:`<span class="hsrc">もと：${esc(x.src)}　${esc(x.srcArt)}</span>`}</div>
     <div class="ttitle">${esc(x.head)}</div>
     <div class="hbody mincho">${esc(x.body)}</div>
   </div>
   <div class="expander" onclick="toggleH('${x.id}')">${open?'閉じる':'もとにした条文と、この書き方にした理由'}<span>${open?I.up:I.down}</span></div>
   ${open?`<div class="detail">
     <div class="pgrp kai"><div class="pgh"><span class="slab kai">なぜこの書き方か</span></div>
       <div class="pnote">${esc(x.why)}</div></div>
     ${x.srcText?`<div class="pgrp sai"><div class="pgh"><span class="slab sai">もとにした条文</span>
        <span class="pgn">${esc(x.src)}</span></div>
       <div class="prow"><div class="phead"><b>${esc(x.src)}</b><span class="pdoc">${esc(x.srcDoc)}</span><span class="part">${esc(x.srcArt)}</span></div>
       <div class="ptext">${esc(x.srcText)}</div></div></div>`:''}
   </div>`:''}
 </div>`;
}
function viewPDF(){
 let h=`<div class="hero"><h2>会則・細則のファイルを1か所に</h2>
   <p class="lead">提出9校からお預かりし、規程ごとに切り分けた正規化ファイルです。<b>どのファイルに何の規程が入っているか</b>もそのまま出しています（1つのファイルに会則と細則がまとまっている学校があります）。「全文を読む」を押すと、その学校の条文をこのページの中で通して読めます。</p></div>`;
 h+=`<div class="card" style="margin-bottom:16px"><div class="sec-h"><span class="ic">${I.doc}</span>提出済み</div><div class="pdf-grid">`;
 h+=SUBMITTED.map(pdfCard).join('');
 h+=`</div></div>`;
 h+=`<div class="card"><div class="sec-h"><span class="ic">${I.clock}</span>これから提出</div><div class="pdf-grid">`;
 h+=PENDING.map(pdfCard).join('');
 h+=`</div><p class="tiny muted" style="margin-top:14px">${I.info} この一覧はスプレッドシートの「02_ファイル台帳」から作っています。ファイルを差し替えたら共有URLの列を書き換えてください。氏名や押印を含むファイル（公開可否＝NG）はここに出ません。リンクが開けないときは共有設定（リンクを知っている人が閲覧可）をご確認ください。</p></div>`;
 return h;
}
function fileRow(x){
 const inner=(x.docs.length>1)?`<div class="frdocs">${I.info} このファイルに入っているもの：${esc(x.docs.join('／'))}</div>`:'';
 const note=x.note&&x.note!=='条文あり'?`<div class="frnote">${esc(x.note)}</div>`:'';
 return `<div class="frow"><a class="pdf-btn" href="${esc(x.url)}" target="_blank" rel="noopener">${I.pdf} ${esc(x.label)}${x.year?`<span class="fry">${esc(x.year)}</span>`:''}</a>${inner}${note}</div>`;
}
function pdfCard(sc){
 const pdf=PDFS[sc.id]||{kaisoku:[],saisoku:[],sanko:[]};
 const nDoc=(DOCFULL[sc.id]||[]).reduce((a,d)=>a+d.arts.length,0);
 const fullBtn=nDoc
   ? `<button class="pdf-btn full" onclick="openDoc('${sc.id}')">${I.book} 全文を読む（${nDoc}条）</button>`
   : (sc.pending?`<button class="pdf-btn dim">未提出</button>`:`<button class="pdf-btn dim">全文は準備中</button>`);
 const badge=sc.pending?`<span class="pdf-badge samp">未提出</span>`:`<span class="pdf-badge real">ファイルあり</span>`;
 const sec=(t,arr)=>arr.length?`<div class="fsec"><div class="fsh">${esc(t)}</div>${arr.map(fileRow).join('')}</div>`:'';
 return `<div class="pdf-card ${sc.real?'real':''}">
   <div class="pdf-top"><div class="pdf-ico"><div class="lines"><i></i><i></i><i></i><i></i></div><span class="seal mincho">約</span></div>
     <div><div class="pdf-name">${esc(sc.name)}<br>PTA会則・細則</div>${badge}</div></div>
   <div class="pdf-actions">${fullBtn}</div>
   ${sec('会則',pdf.kaisoku)}${sec('細則・規則・内規',pdf.saisoku)}${sec('参考資料（条文なし）',pdf.sanko)}
   ${(!pdf.kaisoku.length&&!pdf.saisoku.length&&!pdf.sanko.length)?`<div class="frnote">${sc.pending?'資料の提出をお待ちしています。':'ファイルが台帳に登録されていません。'}</div>`:''}
 </div>`;
}
/* ---- 全文モーダル（13_条文から組み立てる） ---- */
let DOCSEL={sid:null,doc:0};
function openDoc(sid,di){
 DOCSEL={sid:sid,doc:di||0};
 const sc=SMAP[sid], list=DOCFULL[sid]||[];
 document.getElementById('modalTitle').textContent=(sc?sc.name:'')+' 会則・細則の全文';
 const body=document.getElementById('modalBody');
 if(!list.length){body.innerHTML='<div class="doc-empty">この学校の条文はまだ収録されていません。</div>';showModal();return}
 const d=list[DOCSEL.doc]||list[0];
 let h=`<div class="doctabs">`+list.map((x,i)=>`<button class="doctab ${i===DOCSEL.doc?'on':''}" onclick="openDoc('${sid}',${i})"><span class="dtk ${x.kind==='会則'?'kai':'sai'}">${esc(x.kind)}</span>${esc(x.doc)}<span class="dtn">${x.arts.length}</span></button>`).join('')+`</div>`;
 h+=`<div class="doc-note">${I.info}<div>スプレッドシート「13_条文」に入っている全文をそのまま表示しています。もとの正規化ファイルは「${esc(d.file||'—')}」です。${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">ファイルを開く</a>`:''}</div></div>`;
 h+=`<div class="doc-ch mincho">${esc(d.doc)}</div>`;
 d.arts.forEach(a=>{h+=`<div class="doc-art"><div class="an">${esc(a.art)}${a.head?`<span class="anh">（${esc(a.head)}）</span>`:''}</div><div class="at">${esc(a.text)}</div>${a.note?`<div class="pnoteline">${I.info} ${esc(a.note)}</div>`:''}</div>`});
 body.innerHTML=h;showModal();
}
function showModal(){document.getElementById('modalBg').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modalBg').classList.remove('show');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
